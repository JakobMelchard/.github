name: tofu

# No pull_request trigger: tofu code from a PR would run with the OIDC secrets. Plan with workflow_dispatch.
on:
  push:
    branches: [$default-branch]
    paths:
      - terraform/**
      - "!terraform/state/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tofu:
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    uses: JakobMelchard/.github/.github/workflows/tofu.yml@131a9a7cd081fa4bc30044fa2c661ad11c988e60 # v2.8.0
