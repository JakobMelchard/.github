name: tofu

# No pull_request trigger: tofu code from a PR would run with the OIDC secrets. Plan with workflow_dispatch.
on:
  push:
    branches: [$default-branch]
    paths:
      - terraform/**
      - "!terraform/state/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tofu:
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    uses: JakobMelchard/.github/.github/workflows/tofu.yml@88bfcf0fb6db99ff67f1e0e8f082f9b7e391028d # v2.4.1
