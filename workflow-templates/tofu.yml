name: tofu

# No pull_request trigger: tofu code from a PR would run with the OIDC secrets. Plan with workflow_dispatch.
on:
  push:
    branches: [$default-branch]
    paths:
      - terraform/**
      - "!terraform/state/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tofu:
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    uses: JakobMelchard/.github/.github/workflows/tofu.yml@531b4dcb30293e6219d67e312e164cc262a69955 # v2.3.1
