name: tofu

# No pull_request trigger: tofu code from a PR would run with the OIDC secrets. Plan with workflow_dispatch.
on:
  push:
    branches: [$default-branch]
    paths:
      - terraform/**
      - "!terraform/state/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tofu:
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    uses: JakobMelchard/.github/.github/workflows/tofu.yml@300db7253529e4f39ed4af1fc21c7eb39d32bdd0 # v2.8.4
