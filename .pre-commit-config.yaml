default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: [--severity=warning]
        exclude_types: [zsh]
  # hooks/ lives here, so run it from the working tree; consumers pin a hooks-vX.Y.Z tag
  - repo: local
    hooks:
      - id: conventional-commit
        name: conventional commit subject
        entry: hooks/conventional-commit.sh
        language: script
        stages: [commit-msg]
      - id: shell-syntax
        name: shell syntax
        entry: hooks/shell-syntax.sh
        language: script
        types: [shell]
        exclude: \.bats$ # @test blocks are not bash; bats checks them when it runs
      - id: tofu-fmt
        name: tofu fmt
        entry: hooks/tofu-fmt.sh
        language: script
        types: [terraform]
