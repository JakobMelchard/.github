name: gitleaks
description: Scan the checkout for committed secrets.

inputs:
  args:
    description: Extra gitleaks arguments, space-separated; values with spaces are not supported.
    required: false
    default: ""
  config:
    description: Path to a .gitleaks.toml, relative to the workspace.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: install gitleaks
      shell: bash
      run: |
        VERSION=8.28.0
        case "$(uname -m)" in
          aarch64|arm64) ARCH=arm64 SHA256=eff65261156100e5d94a6b3dec313d532fddfe19ae1590bf7a2b4f2699128356 ;;
          *) ARCH=x64 SHA256=a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb ;;
        esac
        tmp=$(mktemp -d)
        curl -fsSL -o "$tmp/gitleaks.tgz" "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_${ARCH}.tar.gz"
        echo "$SHA256  $tmp/gitleaks.tgz" | sha256sum -c -
        tar -xzf "$tmp/gitleaks.tgz" -C "$tmp" gitleaks
        sudo install -m 0755 "$tmp/gitleaks" /usr/local/bin/gitleaks
        rm -rf "$tmp"

    - name: scan
      shell: bash
      env:
        CONFIG: ${{ inputs.config }}
        EXTRA: ${{ inputs.args }}
      run: |
        # shellcheck disable=SC2086 # EXTRA is split into flags on purpose
        gitleaks dir . --no-banner --redact ${CONFIG:+--config "$CONFIG"} $EXTRA
