name: feedback-triage
description: >
  Triage one `feedback` issue with opencode's read-only agent: new title, kind label
  (bug, enhancement, question), a summary comment, and `agent:ready` when the change is
  scoped enough for a coding agent. Runs in the calling repo's checkout.

inputs:
  issue:
    description: Issue number to triage.
    required: true
  model:
    description: opencode model as provider/model.
    required: false
    default: opencode-go/mimo-v2.5
  version:
    description: opencode-ai npm version.
    required: false
    default: "1.18.33"
  token:
    description: GitHub token with issues write on the repo.
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Install opencode
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: npm install -g "opencode-ai@$VERSION" --no-audit --no-fund

    - name: Triage
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        GH_REPO: ${{ github.repository }}
        ISSUE: ${{ inputs.issue }}
        MODEL: ${{ inputs.model }}
        ACTION: ${{ github.action_path }}
        OPENCODE_CONFIG: ${{ github.action_path }}/opencode.triage.json
        PROMPT: ${{ github.action_path }}/triage-prompt.md
      run: python3 "$ACTION/triage.py"
