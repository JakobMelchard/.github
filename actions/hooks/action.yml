name: hooks
description: >
  Point core.hooksPath at the vendored .githooks/ in this checkout, so hook-driven
  checks run in CI exactly as they do locally. Optionally refresh the vendored
  copies from JakobMelchard/.githooks first — that repo is private, so a refresh
  needs a token that can read it (an app token or PAT); github.token cannot.

inputs:
  refresh:
    description: Re-vendor pre-commit and pre-push from JakobMelchard/.githooks before use.
    required: false
    default: "false"
  ref:
    description: >
      Ref of JakobMelchard/.githooks to refresh from. Executed with the supplied
      token, so only point it at refs you control (a tag or SHA of that repo).
    required: false
    default: main
  token:
    description: Token with contents:read on JakobMelchard/.githooks. Only used when refresh is true.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: refresh vendored hooks
      if: inputs.refresh == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token || github.token }}
        HOOKS_REF: ${{ inputs.ref }}
      run: |
        tmp=$(mktemp)
        gh api -H 'Accept: application/vnd.github.raw+json' "repos/JakobMelchard/.githooks/contents/install?ref=$HOOKS_REF" > "$tmp"
        [ -s "$tmp" ] || { echo "empty response from gh api" >&2; exit 1; }
        bash "$tmp"

    - name: use vendored hooks
      shell: bash
      run: |
        for h in pre-commit pre-push; do
          [ -x ".githooks/$h" ] || { echo "no vendored .githooks/$h — run hooks-install locally and commit it" >&2; exit 1; }
        done
        git config core.hooksPath .githooks
        echo "hooksPath=.githooks: $(ls .githooks | tr '\n' ' ')"
