# Our own reusable workflows are consumed at @main on purpose (lint.yml here is the gate).
# Third-party actions must be hash-pinned.
rules:
  unpinned-uses:
    config:
      policies:
        "JakobMelchard/*": ref-pin
        "*": hash-pin
  # actionlint cannot parse the $/ self-reference form yet, and ./ does not count as pinned.
  self-repository:
    ignore:
      - lint.yml
      - self-release.yml
