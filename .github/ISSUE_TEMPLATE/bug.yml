name: Bug
description: Something does not behave as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Steps to reproduce, what you expected, what you got.
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Version or commit
      placeholder: v1.4.0 or 756314b
  - type: textarea
    id: logs
    attributes:
      label: Logs or output
      render: shell
