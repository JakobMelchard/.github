name: Task
description: A change to make, with a verifiable outcome
labels: [enhancement]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: One paragraph. What is different when this is done, and how would you check it.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Constraints, links, related issues.
