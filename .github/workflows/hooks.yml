name: hooks

# Reusable prek run: the caller's .pre-commit-config.yaml over every tracked file. The gate for
# checks that local hooks can skip. The required check is "<caller job> / prek".
#
#   jobs:
#     hooks:
#       uses: JakobMelchard/.github/.github/workflows/hooks.yml@vX.Y.Z
#       with: { skip: 'eslint,prettier' }

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      skip:
        description: Comma-separated hook ids to skip on this runner (SKIP for prek), e.g. swift-format on Linux.
        type: string
        default: ""
      working-directory:
        description: Directory holding .pre-commit-config.yaml; also where tokens-check looks for .config/tokens.path.
        type: string
        default: "."
      runs-on:
        description: >
          Runner label (plain, unlike shell.yml). Empty picks the org variable RUNNER_LINUX
          (self-hosted on mimi, visible to private repos only) and falls back to Blacksmith (ubuntu-latest outside JakobMelchard).
        type: string
        default: ""

jobs:
  prek:
    timeout-minutes: 30
    runs-on: ${{ inputs.runs-on || fromJSON(vars.RUNNER_LINUX || (github.repository_owner == 'JakobMelchard' && '"blacksmith-2vcpu-ubuntu-2404"' || '"ubuntu-latest"')) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }

      - name: provenance
        # job.workflow_ref and job.workflow_sha are read through toJSON: actionlint's job context lacks them.
        env:
          JOB: ${{ toJSON(job) }}
        shell: bash
        run: |
          ref=$(jq -r '.workflow_ref // "unknown"' <<<"$JOB")
          sha=$(jq -r '.workflow_sha // "unknown"' <<<"$JOB")
          echo "reusable workflow: $ref @ $sha"
          echo "Reusable workflow: \`$ref\` @ \`$sha\`" >> "$GITHUB_STEP_SUMMARY"

      # A no-op unless the repo has .config/tokens.path.
      - uses: JakobMelchard/.github/actions/tokens-check@main
        with:
          working-directory: ${{ inputs.working-directory }}

      - uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
        env:
          SKIP: ${{ inputs.skip }}
        with:
          working-directory: ${{ inputs.working-directory }}
          extra-args: --all-files
