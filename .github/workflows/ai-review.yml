name: ai-review

# Reusable PR-Agent review. Labelling a ready PR "ai:pr-agent" gets one review through OpenCode Go.
# The model key comes from Infisical over OIDC, or from the opencode-api-key secret where that
# identity does not reach (repos outside JakobMelchard). The caller runs it on
# `pull_request: labeled` and grants pull-requests: write, issues: write and id-token: write.
#
#   on: { pull_request: { types: [labeled] } }
#   jobs:
#     review:
#       uses: JakobMelchard/.github/.github/workflows/ai-review.yml@vX.Y.Z
#       permissions: { contents: read, pull-requests: write, issues: write, id-token: write }

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      runs-on:
        description: >
          JSON runner spec, a quoted label or a label array, e.g. '["self-hosted","Linux"]' or a
          caller's vars.RUNNER_LINUX. Empty picks the org variable RUNNER_LINUX and falls back
          to Blacksmith (ubuntu-latest outside JakobMelchard).
        type: string
        default: ""
    secrets:
      opencode-api-key:
        description: OpenCode Go API key. Its presence skips the Infisical fetch.
        required: false

jobs:
  review:
    if: >-
      github.event.label.name == 'ai:pr-agent' && !github.event.pull_request.draft &&
      github.event.sender.type != 'Bot' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON(inputs.runs-on || vars.RUNNER_LINUX || (github.repository_owner == 'JakobMelchard' && '"blacksmith-2vcpu-ubuntu-2404"' || '"ubuntu-latest"')) }}
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    env:
      PR_URL: ${{ github.event.pull_request.html_url }}
      PR_NUM: ${{ github.event.pull_request.number }}
      HAS_KEY: ${{ secrets.opencode-api-key != '' }}
      GITHUB__USER_TOKEN: ${{ github.token }}
      OPENAI__API_BASE: https://opencode.ai/zen/go/v1
      CONFIG__MODEL: openai/mimo-v2.6-pro
      # A different upstream, in case the primary model is down
      CONFIG__FALLBACK_MODELS: '["openai/glm-5.3"]'
      # litellm does not know the model, so 64000 is a guess. PR-Agent takes the smaller of the two,
      # and max_model_tokens defaults to 32000, so both are set.
      CONFIG__CUSTOM_MODEL_MAX_TOKENS: '64000'
      CONFIG__MAX_MODEL_TOKENS: '64000'
      # Reviews a PR that does not fit in chunks, at most 4 model calls
      PR_REVIEWER__ENABLE_LARGE_PR_CHUNKING: 'true'
      PR_REVIEWER__MAX_NUMBER_OF_CALLS: '4'
      IGNORE__GLOB: '["**/*.tfstate","**/*.tfstate.backup","**/*.lock","**/*.lockb","**/*.plist","**/*dashboard*.json","**/package-lock.json","**/pnpm-lock.yaml","**/go.sum","**/.terraform.lock.hcl","**/Package.resolved"]'
      # Per attempt, with no retries, so a stalled model costs one timeout before the fallback.
      CONFIG__AI_TIMEOUT: '300'
      CONFIG__NUM_RETRIES: '0'
      CONFIG__RETRY_SAME_MODEL_ON_TIMEOUT: 'false'
    steps:
      # secret-name: only this secret enters the job env
      - if: env.HAS_KEY != 'true'
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: b1ede60d-f7a7-4699-86ec-eea6ac51be30 # gha-org
          domain: https://eu.infisical.com
          project-slug: gha-lfq-y
          env-slug: dev
          secret-name: OPENCODE_API_KEY

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: review
        shell: bash
        env:
          OPENAI__KEY: ${{ secrets.opencode-api-key || env.OPENCODE_API_KEY }}
        run: |
          set -o pipefail
          # OpenCode Go rejects requests without a session id and wants a custom agent
          export OPENAI_CUSTOM_HEADERS="x-opencode-session: pr-review-${GITHUB_REPOSITORY##*/}-${PR_NUM}
          User-Agent: jm-pr-review/1.0"
          log="$RUNNER_TEMP/pr-agent.log"
          uv run --python 3.12 --with pr-agent==0.47.0 python -m pr_agent.cli --pr_url "$PR_URL" review 2>&1 | tee "$log"
          # PR-Agent exits 0 after posting "Failed to review PR" as a comment
          if grep -q "Failed to review PR" "$log"; then
            echo "::error::PR-Agent failed to review the PR"
            exit 1
          fi
