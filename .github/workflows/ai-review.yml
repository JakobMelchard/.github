name: ai-review

# Reusable PR-Agent review. Labelling a ready PR "ai:pr-agent" gets one review through OpenCode Go.
# The model key comes from Infisical over OIDC, or from the opencode-api-key secret where that
# identity does not reach (repos outside JakobMelchard). The caller runs it on
# `pull_request: labeled` and grants pull-requests: write, issues: write and id-token: write.
# Every run bills the owner's OpenCode Go budget, so a repo gets at most daily-cap runs a day.
#
#   on: { pull_request: { types: [labeled] } }
#   jobs:
#     review:
#       uses: JakobMelchard/.github/.github/workflows/ai-review.yml@vX.Y.Z
#       permissions: { contents: read, pull-requests: write, issues: write, id-token: write }

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      runs-on:
        description: >
          JSON runner spec, a quoted label or a label array, e.g. '["self-hosted","Linux"]' or a
          caller's vars.RUNNER_LINUX. Empty picks the org variable RUNNER_LINUX and falls back
          to ubuntu-latest.
        type: string
        default: ""
      daily-cap:
        description: >
          Most ai:pr-agent labels a repo may get in 24 h before the review is skipped with a
          notice. 0 picks the variable AI_REVIEW_DAILY_CAP, else 10. The variable set to 0 stops all reviews.
        type: number
        default: 0
    secrets:
      opencode-api-key:
        description: OpenCode Go API key. Its presence skips the Infisical fetch.
        required: false

jobs:
  review:
    if: >-
      github.event.label.name == 'ai:pr-agent' && !github.event.pull_request.draft &&
      github.event.sender.type != 'Bot' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON(inputs.runs-on || vars.RUNNER_LINUX || '"ubuntu-latest"') }}
    timeout-minutes: 15
    # One review per PR at a time; a newer label replaces a queued run, never a running one
    concurrency:
      group: pr-agent-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    env:
      PR_URL: ${{ github.event.pull_request.html_url }}
      PR_NUM: ${{ github.event.pull_request.number }}
      HAS_KEY: ${{ secrets.opencode-api-key != '' }}
      GITHUB__USER_TOKEN: ${{ github.token }}
      OPENAI__API_BASE: https://opencode.ai/zen/go/v1
      MODEL: openai/mimo-v2.6-pro
      # A different upstream, tried only when the primary fails with neither a timeout nor a
      # usage limit: both bill or hit the same OpenCode Go budget on every model
      FALLBACK_MODEL: openai/glm-5.3
      CONFIG__FALLBACK_MODELS: '[]'
      # litellm does not know the model, so 64000 is a guess. PR-Agent takes the smaller of the two,
      # and max_model_tokens defaults to 32000, so both are set.
      CONFIG__CUSTOM_MODEL_MAX_TOKENS: '64000'
      CONFIG__MAX_MODEL_TOKENS: '64000'
      # Reviews a PR that does not fit in chunks, at most 4 model calls
      PR_REVIEWER__ENABLE_LARGE_PR_CHUNKING: 'true'
      PR_REVIEWER__MAX_NUMBER_OF_CALLS: '4'
      IGNORE__GLOB: '["**/*.tfstate","**/*.tfstate.backup","**/*.lock","**/*.lockb","**/*.plist","**/*dashboard*.json","**/package-lock.json","**/pnpm-lock.yaml","**/go.sum","**/.terraform.lock.hcl","**/Package.resolved"]'
      # Per attempt, with no retries, so a stalled model costs one timeout and the job fails.
      CONFIG__AI_TIMEOUT: '300'
      CONFIG__NUM_RETRIES: '0'
      CONFIG__RETRY_SAME_MODEL_ON_TIMEOUT: 'false'
    steps:
      - uses: JakobMelchard/.github/actions/scripts@88bfcf0fb6db99ff67f1e0e8f082f9b7e391028d # v2.4.1

      # Counts ai:pr-agent label events, one per run, since the issues API needs no extra permission
      - name: daily cap
        id: cap
        env:
          GH_TOKEN: ${{ github.token }}
          CAP: ${{ inputs.daily-cap || vars.AI_REVIEW_DAILY_CAP || 10 }}
        run: jm-ai-review-cap

      # secret-name: only this secret enters the job env
      - if: steps.cap.outputs.skip != 'true' && env.HAS_KEY != 'true'
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: b1ede60d-f7a7-4699-86ec-eea6ac51be30 # gha-org
          domain: https://eu.infisical.com
          project-slug: gha-lfq-y
          env-slug: dev
          secret-name: OPENCODE_API_KEY

      - if: steps.cap.outputs.skip != 'true'
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: review
        if: steps.cap.outputs.skip != 'true'
        timeout-minutes: 12
        env:
          OPENAI__KEY: ${{ secrets.opencode-api-key || env.OPENCODE_API_KEY }}
        run: jm-ai-review
