name: labels

# Keep every org repo's labels at what infra/settings.json declares (infra/labels
# does the work; run it by hand from a clone for a single repo). github.token
# only reaches this repo, so cross-repo writes need the org GitHub App — see
# README "GitHub App". APP_* come from Infisical (project gha, identity gha-org, OIDC).

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - infra/settings.json
      - infra/labels
      - .github/workflows/labels.yml
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }

      - name: repositories from settings.json
        id: repos
        shell: bash
        run: echo "list=$(jq -r '.repos | to_entries[] | select(.value.archived != true) | .key' infra/settings.json | paste -sd, -)" >> "$GITHUB_OUTPUT"

      - uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: b1ede60d-f7a7-4699-86ec-eea6ac51be30 # gha-org
          domain: https://eu.infisical.com
          project-slug: gha-lfq-y
          env-slug: dev

      - name: mint app token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ env.APP_CLIENT_ID }}
          private-key: ${{ env.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.repos.outputs.list }}
          permission-issues: write

      - name: sync labels
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: infra/labels
