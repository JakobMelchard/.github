name: python

# Reusable Python CI. Callers: transcriber, monitor, observe, CKAD-prep.
#
# package-manager:
#   uv    -> uv sync (observe, transcriber, CKAD-prep)
#   pip   -> python -m venv .venv && .venv/bin/pip install -e ".[dev]"
#   none  -> stdlib only, no install step (monitor)

on:
  workflow_call:
    inputs:
      python-version:
        type: string
        default: "3.12"
      working-directory:
        type: string
        default: "."
      package-manager:
        description: uv | pip | none
        type: string
        default: uv
      install-cmd:
        description: Overrides the package-manager default when set.
        type: string
        default: ""
      lint-cmd:
        type: string
        default: "ruff check ."
      test-cmd:
        type: string
        default: "pytest"
      runs-on:
        type: string
        default: ubuntu-latest
      private-deps:
        description: >
          Authenticate git so private JakobMelchard repos referenced as
          dependencies (git+https://…) resolve. Requires secrets: inherit.
        type: boolean
        default: false
    secrets:
      token:
        description: PAT or app token with read access to the private dependency repos.
        required: false

jobs:
  ci:
    runs-on: ${{ inputs.runs-on }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        if: inputs.package-manager == 'uv'
        with:
          enable-cache: true

      # Commands go through env vars, not direct interpolation: an empty
      # `${{ }}` inside an if/case block produces an empty body, which is a
      # bash syntax error.
      # pip/uv shell out to git over https; a token must be wired into git config.
      - name: configure private dependency access
        if: inputs.private-deps
        env:
          TOKEN: ${{ secrets.token || github.token }}
        run: git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: install
        env:
          INSTALL_CMD: ${{ inputs.install-cmd }}
          PKG_MGR: ${{ inputs.package-manager }}
        run: |
          if [ -n "$INSTALL_CMD" ]; then
            eval "$INSTALL_CMD"
          else
            case "$PKG_MGR" in
              uv)   uv sync --all-extras ;;
              pip)  python -m venv .venv && .venv/bin/pip install -e '.[dev]' ;;
              none) echo 'stdlib only — no install' ;;
              *)    echo "unknown package-manager: $PKG_MGR" >&2; exit 1 ;;
            esac
          fi

      - name: lint
        if: inputs.lint-cmd != ''
        env:
          LINT_CMD: ${{ inputs.lint-cmd }}
          PKG_MGR: ${{ inputs.package-manager }}
        run: |
          case "$PKG_MGR" in
            uv)   eval "uv run $LINT_CMD" ;;
            pip)  eval ".venv/bin/$LINT_CMD" ;;
            *)    eval "$LINT_CMD" ;;
          esac

      - name: test
        if: inputs.test-cmd != ''
        env:
          TEST_CMD: ${{ inputs.test-cmd }}
          PKG_MGR: ${{ inputs.package-manager }}
        run: |
          case "$PKG_MGR" in
            uv)   eval "uv run $TEST_CMD" ;;
            pip)  eval ".venv/bin/$TEST_CMD" ;;
            *)    eval "$TEST_CMD" ;;
          esac
