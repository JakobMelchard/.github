name: python

# Reusable Python CI: install, lint, test. Skips ci for Markdown-only changes.
#
#   jobs:
#     ci:
#       uses: JakobMelchard/.github/.github/workflows/python.yml@vX.Y.Z
#       with: { package-manager: uv }

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      python-version:
        description: Interpreter version for actions/setup-python.
        type: string
        default: "3.12"
      working-directory:
        description: Directory every run step executes in.
        type: string
        default: "."
      package-manager:
        description: >
          uv, pip or none. Picks the default install and how lint-cmd and test-cmd run.
          uv: `uv sync --all-extras`, commands as `uv run <cmd>`. pip: a .venv with
          `pip install -e ".[dev]"`, commands as `.venv/bin/<cmd>`. none: no install, commands
          run bare. Any other value fails the install step unless install-cmd is set.
        type: string
        default: uv
      install-cmd:
        description: Replaces the package-manager install when set.
        type: string
        default: ""
      lint-cmd:
        description: >
          Empty skips the step. The uv or pip prefix applies to the start of the string only:
          write "ruff check . && uv run mypy" for several commands.
        type: string
        default: "ruff check ."
      test-cmd:
        description: Empty skips the step. Same prefix rule as lint-cmd.
        type: string
        default: "pytest"
      runs-on:
        description: >
          Runner label for the ci job only (pr-title and changes always use RUNNER_LINUX).
          Empty picks the org variable RUNNER_LINUX (self-hosted, visible to
          private repos only) and falls back to ubuntu-latest.
        type: string
        default: ""
      private-deps:
        description: >
          Wire a token into git so private JakobMelchard repos referenced as git+https://
          dependencies resolve. The token is the minted app token, else github.token.
        type: boolean
        default: false
      private-repos:
        description: >
          Comma or newline separated repos the minted app token may read, e.g. "observe".
          Only used with app credentials.
        type: string
        default: ""
    secrets:
      app-client-id:
        description: GitHub App client ID. Only read when private-deps is true.
        required: false
      app-private-key:
        description: GitHub App private key. Its presence selects the app path.
        required: false

jobs:
  # The title becomes the squash commit that release-please reads; same regex as the .githooks conventional-commit hook.
  pr-title:
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    runs-on: ${{ fromJSON(vars.RUNNER_LINUX || '"ubuntu-latest"') }}
    steps:
      - uses: JakobMelchard/.github/actions/scripts@88bfcf0fb6db99ff67f1e0e8f082f9b7e391028d # v2.4.1
      - name: conventional title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: jm-pr-title

  changes:
    timeout-minutes: 10
    runs-on: ${{ fromJSON(vars.RUNNER_LINUX || '"ubuntu-latest"') }}
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      - id: files
        uses: JakobMelchard/.github/actions/code-changed@88bfcf0fb6db99ff67f1e0e8f082f9b7e391028d # v2.4.1

  ci:
    timeout-minutes: 60
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ inputs.runs-on || fromJSON(vars.RUNNER_LINUX || '"ubuntu-latest"') }}
    env:
      # `secrets` is unavailable in a step-level `if`; expose only the boolean, never the key.
      HAS_APP: ${{ secrets.app-private-key != '' }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }

      - uses: JakobMelchard/.github/actions/scripts@88bfcf0fb6db99ff67f1e0e8f082f9b7e391028d # v2.4.1

      - name: provenance
        # job.workflow_ref and job.workflow_sha are read through toJSON: actionlint's job context lacks them.
        env:
          JOB: ${{ toJSON(job) }}
        shell: bash
        run: |
          ref=$(jq -r '.workflow_ref // "unknown"' <<<"$JOB")
          sha=$(jq -r '.workflow_sha // "unknown"' <<<"$JOB")
          echo "reusable workflow: $ref @ $sha"
          echo "Reusable workflow: \`$ref\` @ \`$sha\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        if: inputs.package-manager == 'uv'
        with:
          enable-cache: true

      - name: mint app token
        id: app
        if: inputs.private-deps && env.HAS_APP == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.app-client-id }}
          private-key: ${{ secrets.app-private-key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ inputs.private-repos }}
          permission-contents: read

      # pip and uv shell out to git over https. GIT_CONFIG_* in the job env, not ~/.gitconfig: a
      # persistent runner would keep the token for later jobs.
      - name: configure private dependency access
        if: inputs.private-deps
        env:
          TOKEN: ${{ steps.app.outputs.token || github.token }}
        run: jm-git-auth

      # Commands go through env vars: an empty `${{ }}` interpolated into an if/case body is a
      # bash syntax error.
      - name: install
        env:
          INSTALL_CMD: ${{ inputs.install-cmd }}
          PKG_MGR: ${{ inputs.package-manager }}
        run: jm-py-install

      - name: lint
        if: inputs.lint-cmd != ''
        env:
          LINT_CMD: ${{ inputs.lint-cmd }}
          PKG_MGR: ${{ inputs.package-manager }}
        run: jm-py "$LINT_CMD"

      - name: test
        if: inputs.test-cmd != ''
        env:
          TEST_CMD: ${{ inputs.test-cmd }}
          PKG_MGR: ${{ inputs.package-manager }}
        run: jm-py "$TEST_CMD"
