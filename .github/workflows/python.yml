name: python

# Reusable Python CI: install, lint, test. Skips ci for Markdown-only changes.
#
#   jobs:
#     ci:
#       uses: JakobMelchard/.github/.github/workflows/python.yml@vX.Y.Z
#       with: { package-manager: uv }

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      python-version:
        description: Interpreter version for actions/setup-python.
        type: string
        default: "3.12"
      working-directory:
        description: Directory every run step executes in.
        type: string
        default: "."
      package-manager:
        description: >
          uv, pip or none. Picks the default install and how lint-cmd and test-cmd run.
          uv: `uv sync --all-extras`, commands as `uv run <cmd>`. pip: a .venv with
          `pip install -e ".[dev]"`, commands as `.venv/bin/<cmd>`. none: no install, commands
          run bare. Any other value fails the install step.
        type: string
        default: uv
      install-cmd:
        description: Replaces the package-manager install when set.
        type: string
        default: ""
      lint-cmd:
        description: >
          Empty skips the step. The uv or pip prefix applies to the start of the string only:
          write "ruff check . && uv run mypy" for several commands.
        type: string
        default: "ruff check ."
      test-cmd:
        description: Empty skips the step. Same prefix rule as lint-cmd.
        type: string
        default: "pytest"
      runs-on:
        description: >
          Runner label for the ci job only (pr-title and changes always use RUNNER_LINUX).
          Empty picks the org variable RUNNER_LINUX (self-hosted on mimi, visible to
          private repos only) and falls back to ubuntu-latest.
        type: string
        default: ""
      private-deps:
        description: >
          Wire a token into git so private JakobMelchard repos referenced as git+https://
          dependencies resolve. The token is the minted app token, else the token secret,
          else github.token.
        type: boolean
        default: false
      private-repos:
        description: >
          Comma or newline separated repos the minted app token may read, e.g. "observe".
          Only used with app credentials.
        type: string
        default: ""
    secrets:
      app-client-id:
        description: GitHub App client ID, preferred over a PAT. Only read when private-deps is true.
        required: false
      app-private-key:
        description: GitHub App private key. Its presence selects the app path.
        required: false
      token:
        description: PAT fallback, used when no app private key is supplied.
        required: false

jobs:
  # The title becomes the squash commit that release-please reads; same regex as .githooks/commit-msg.
  pr-title:
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    runs-on: ${{ fromJSON(vars.RUNNER_LINUX || '"ubuntu-latest"') }}
    steps:
      - name: conventional title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        shell: bash
        run: |
          types='feat|fix|chore|docs|refactor|test|ci|build|perf|style|revert'
          if printf '%s\n' "$TITLE" | grep -Eq "^($types)(\([A-Za-z0-9._/-]+\))?!?: .+"; then
            echo "ok: $TITLE"
          else
            echo "::error title=PR title::'$TITLE' is not a conventional commit: <type>(<scope>)!: <subject>, type one of $types"
            exit 1
          fi

  changes:
    timeout-minutes: 10
    runs-on: ${{ fromJSON(vars.RUNNER_LINUX || '"ubuntu-latest"') }}
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      - id: files
        uses: JakobMelchard/.github/actions/code-changed@main

  ci:
    timeout-minutes: 60
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ inputs.runs-on || fromJSON(vars.RUNNER_LINUX || '"ubuntu-latest"') }}
    env:
      # `secrets` is unavailable in a step-level `if`; expose only the boolean, never the key.
      HAS_APP: ${{ secrets.app-private-key != '' }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }

      - name: provenance
        # job.workflow_ref and job.workflow_sha are read through toJSON: actionlint's job context lacks them.
        env:
          JOB: ${{ toJSON(job) }}
        shell: bash
        run: |
          ref=$(jq -r '.workflow_ref // "unknown"' <<<"$JOB")
          sha=$(jq -r '.workflow_sha // "unknown"' <<<"$JOB")
          echo "reusable workflow: $ref @ $sha"
          echo "Reusable workflow: \`$ref\` @ \`$sha\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        if: inputs.package-manager == 'uv'
        with:
          enable-cache: true

      - name: mint app token
        id: app
        if: inputs.private-deps && env.HAS_APP == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.app-client-id }}
          private-key: ${{ secrets.app-private-key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ inputs.private-repos }}
          permission-contents: read

      # pip and uv shell out to git over https.
      - name: configure private dependency access
        if: inputs.private-deps
        env:
          TOKEN: ${{ steps.app.outputs.token || secrets.token || github.token }}
        run: git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"

      # Commands go through env vars: an empty `${{ }}` interpolated into an if/case body is a
      # bash syntax error.
      - name: install
        env:
          INSTALL_CMD: ${{ inputs.install-cmd }}
          PKG_MGR: ${{ inputs.package-manager }}
        run: |
          if [ -n "$INSTALL_CMD" ]; then
            eval "$INSTALL_CMD"
          else
            case "$PKG_MGR" in
              uv)   uv sync --all-extras ;;
              pip)  python -m venv .venv && .venv/bin/pip install -e '.[dev]' ;;
              none) ;;
              *)    echo "unknown package-manager: $PKG_MGR" >&2; exit 1 ;;
            esac
          fi

      - name: lint
        if: inputs.lint-cmd != ''
        env:
          LINT_CMD: ${{ inputs.lint-cmd }}
          PKG_MGR: ${{ inputs.package-manager }}
        run: |
          case "$PKG_MGR" in
            uv)   eval "uv run $LINT_CMD" ;;
            pip)  eval ".venv/bin/$LINT_CMD" ;;
            *)    eval "$LINT_CMD" ;;
          esac

      - name: test
        if: inputs.test-cmd != ''
        env:
          TEST_CMD: ${{ inputs.test-cmd }}
          PKG_MGR: ${{ inputs.package-manager }}
        run: |
          case "$PKG_MGR" in
            uv)   eval "uv run $TEST_CMD" ;;
            pip)  eval ".venv/bin/$TEST_CMD" ;;
            *)    eval "$TEST_CMD" ;;
          esac
