name: python

# Reusable Python CI.
#
#   jobs:
#     python:
#       uses: JakobMelchard/.github/.github/workflows/python.yml@main
#       with:
#         package-manager: uv
#       secrets: inherit          # only if the repo needs private dependencies
#
# Inputs (all optional):
#   python-version    string,  default "3.12"        Interpreter for actions/setup-python.
#   working-directory string,  default "."           Directory every run step executes in.
#   package-manager   string,  default "uv"          uv | pip | none. Picks the default install and
#                                                     how lint-cmd and test-cmd are invoked:
#                                                       uv   -> uv sync --all-extras; commands run as
#                                                               `uv run <cmd>`
#                                                       pip  -> python -m venv .venv && .venv/bin/pip
#                                                               install -e ".[dev]"; commands run as
#                                                               `.venv/bin/<cmd>`
#                                                       none -> stdlib only, no install; commands run bare
#                                                     Any other value fails the install step.
#   install-cmd       string,  default ""            When set, replaces the package-manager install.
#   lint-cmd          string,  default "ruff check ." "" skips the step. Only the start of the string gets
#                                                     the uv/pip prefix: write
#                                                     "ruff check . && uv run mypy" for several commands.
#   test-cmd          string,  default "pytest"      "" skips the step. Same prefix rule as lint-cmd.
#   runs-on           string,  default ""            Runner label for the ci job only (pr-title and
#                                                     changes always use RUNNER_LINUX). Empty picks the
#                                                     org variable RUNNER_LINUX (self-hosted on mimi,
#                                                     private repos only) and falls back to ubuntu-latest.
#   private-deps      boolean, default false         Wire a token into git so private JakobMelchard
#                                                     repos referenced as git+https:// dependencies
#                                                     resolve.
#   private-repos     string,  default ""            Comma/newline-separated repos the minted app token
#                                                     may read, e.g. "observe". Only with app secrets.
#
# Secrets (all optional, only read when private-deps is true): app-client-id and app-private-key
# (GitHub App, preferred), else token (PAT), else the job's github.token.
#
# Jobs: pr-title (pull_request only: Conventional Commits check), changes (skips ci for markdown-only
# diffs), ci. Commands run through eval.
#
# Callers: content (lint-cmd; pinned v1.3.0), infra (python-version, package-manager, install-cmd, lint-cmd,
# test-cmd; pinned v1.3.0), monitor (python-version, package-manager none, install-cmd, lint-cmd,
# test-cmd), observe (python-version, package-manager, lint-cmd; pinned v1.3.0).

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      python-version:
        type: string
        default: "3.12"
      working-directory:
        type: string
        default: "."
      package-manager:
        description: uv | pip | none
        type: string
        default: uv
      install-cmd:
        description: Overrides the package-manager default when set.
        type: string
        default: ""
      lint-cmd:
        type: string
        default: "ruff check ."
      test-cmd:
        type: string
        default: "pytest"
      runs-on:
        description: >
          Empty picks the org variable RUNNER_LINUX (self-hosted on mimi, visible to
          private repos only) and falls back to ubuntu-latest.
        type: string
        default: ""
      private-deps:
        description: >
          Authenticate git so private JakobMelchard repos referenced as
          dependencies (git+https://…) resolve.
        type: boolean
        default: false
      private-repos:
        description: >
          Comma/newline-separated repos the minted app token may read,
          e.g. "observe". Only used with app credentials.
        type: string
        default: ""
    secrets:
      app-client-id:
        description: GitHub App client ID (preferred over a PAT — no expiry to babysit).
        required: false
      app-private-key:
        description: GitHub App private key. Presence of this selects the app path.
        required: false
      token:
        description: PAT fallback, used when no app private key is supplied.
        required: false

jobs:
  # The PR title becomes the squash-commit subject that release-please reads.
  # Same regex as .githooks/commit-msg. Skipped on push.
  pr-title:
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    runs-on: ${{ fromJSON(vars.RUNNER_LINUX || '"ubuntu-latest"') }}
    steps:
      - name: conventional title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        shell: bash
        run: |
          types='feat|fix|chore|docs|refactor|test|ci|build|perf|style|revert'
          if printf '%s\n' "$TITLE" | grep -Eq "^($types)(\([A-Za-z0-9._/-]+\))?!?: .+"; then
            echo "ok: $TITLE"
          else
            echo "::error title=PR title::'$TITLE' is not a conventional commit: <type>(<scope>)!: <subject>, type one of $types"
            exit 1
          fi

  # Markdown-only changes skip ci (actions/code-changed); pr-title and the caller's hooks job
  # still run, since they lint titles and docs.
  changes:
    timeout-minutes: 10
    runs-on: ${{ fromJSON(vars.RUNNER_LINUX || '"ubuntu-latest"') }}
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      - id: files
        uses: JakobMelchard/.github/actions/code-changed@main

  ci:
    timeout-minutes: 60
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ inputs.runs-on || fromJSON(vars.RUNNER_LINUX || '"ubuntu-latest"') }}
    env:
      # `secrets` is not available in a step-level `if`. Evaluate the
      # comparison here so only the boolean — never the key — is in env.
      HAS_APP: ${{ secrets.app-private-key != '' }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }

      - name: provenance
        # Which commit of JakobMelchard/.github defined this job. job.workflow_ref and
        # job.workflow_sha (GitHub, Sept 2026) are read through toJSON because
        # actionlint's job-context type does not know them yet.
        env:
          JOB: ${{ toJSON(job) }}
        shell: bash
        run: |
          ref=$(jq -r '.workflow_ref // "unknown"' <<<"$JOB")
          sha=$(jq -r '.workflow_sha // "unknown"' <<<"$JOB")
          echo "reusable workflow: $ref @ $sha"
          echo "Reusable workflow: \`$ref\` @ \`$sha\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        if: inputs.package-manager == 'uv'
        with:
          enable-cache: true

      # Commands go through env vars, not direct interpolation: an empty
      # `${{ }}` inside an if/case block produces an empty body, which is a
      # bash syntax error.
      - name: mint app token
        id: app
        if: inputs.private-deps && env.HAS_APP == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.app-client-id }}
          private-key: ${{ secrets.app-private-key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ inputs.private-repos }}
          permission-contents: read

      # pip/uv shell out to git over https; a token must be wired into git config.
      - name: configure private dependency access
        if: inputs.private-deps
        env:
          TOKEN: ${{ steps.app.outputs.token || secrets.token || github.token }}
        run: git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: install
        env:
          INSTALL_CMD: ${{ inputs.install-cmd }}
          PKG_MGR: ${{ inputs.package-manager }}
        run: |
          if [ -n "$INSTALL_CMD" ]; then
            eval "$INSTALL_CMD"
          else
            case "$PKG_MGR" in
              uv)   uv sync --all-extras ;;
              pip)  python -m venv .venv && .venv/bin/pip install -e '.[dev]' ;;
              none) echo 'stdlib only — no install' ;;
              *)    echo "unknown package-manager: $PKG_MGR" >&2; exit 1 ;;
            esac
          fi

      - name: lint
        if: inputs.lint-cmd != ''
        env:
          LINT_CMD: ${{ inputs.lint-cmd }}
          PKG_MGR: ${{ inputs.package-manager }}
        run: |
          case "$PKG_MGR" in
            uv)   eval "uv run $LINT_CMD" ;;
            pip)  eval ".venv/bin/$LINT_CMD" ;;
            *)    eval "$LINT_CMD" ;;
          esac

      - name: test
        if: inputs.test-cmd != ''
        env:
          TEST_CMD: ${{ inputs.test-cmd }}
          PKG_MGR: ${{ inputs.package-manager }}
        run: |
          case "$PKG_MGR" in
            uv)   eval "uv run $TEST_CMD" ;;
            pip)  eval ".venv/bin/$TEST_CMD" ;;
            *)    eval "$TEST_CMD" ;;
          esac
