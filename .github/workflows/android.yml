name: android

# Reusable Android (Gradle) CI, Linux runner.
#
#   jobs:
#     ci:
#       uses: JakobMelchard/.github/.github/workflows/android.yml@main
#       with:
#         gradle-tasks: ":app:testDebugUnitTest :app:assembleDebug"
#         android-packages: "platforms;android-36 build-tools;36.0.0"
#         artifact-path: app/build/outputs/apk/debug/*.apk
#
# Inputs (all optional):
#   working-directory string, default "."       Directory holding gradlew; only the gradle step runs
#                                               there (setup-cmd runs in the repository root).
#   java-version      string, default "17"      JDK for actions/setup-java.
#   java-distribution string, default "temurin" setup-java distribution.
#   android-packages  string, default "platform-tools"
#                                               Space-separated sdkmanager packages, e.g.
#                                               "platforms;android-35 build-tools;35.0.0".
#   setup-cmd         string, default ""        Runs in the repository root before Gradle, e.g.
#                                               "npm install && npx cap sync android". "" skips it.
#   gradle-tasks      string, default "testDebugUnitTest assembleDebug"
#                                               Passed unquoted to `./gradlew --no-daemon`, so tasks
#                                               and flags are split on spaces. "" skips Gradle.
#   artifact-path     string, default ""        Glob uploaded after the build, relative to the
#                                               repository root, even when Gradle failed. "" skips it.
#   artifact-name     string, default "app-debug"  Name of the uploaded artifact.
#   runs-on           string, default ""        Runner label for the ci job only (pr-title and
#                                               changes always use RUNNER_LINUX). Empty picks the org
#                                               variable RUNNER_LINUX (Blacksmith, x86_64, which
#                                               aapt2 needs) and falls back to ubuntu-latest.
#
# Secrets: none. Outputs: none.
#
# Jobs: pr-title (pull_request only: Conventional Commits check, 5 min), changes (skips ci for
# markdown-only diffs, 10 min), ci (60 min). setup-cmd runs through eval in bash. The gradle cache
# is only set up when a *.gradle* file or gradle-wrapper.properties exists.
#
# Callers (scan 2026-10-11, both accounts):
#   JakobMelchard/workouts-go ci.yml android job (main): java-version, setup-cmd,
#     working-directory, gradle-tasks, artifact-path.
#   JakobMelchard/workouts-hx ci.yml android job (main): setup-cmd, working-directory,
#     gradle-tasks, artifact-path.
#   lilfeelz/fz ci.yml (main): android-packages, artifact-path.
#   JakobMelchard/template ci.yml.jinja (v1.6.0): capacitor job as workouts-go; android template
#     passes android-packages and artifact-path.
#   This repo: lint.yml smoke-android (gradle-tasks "").
#   Never passed by any caller: java-distribution, artifact-name, runs-on. The former callers
#   zmxdroid and lift no longer call it.

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory holding gradlew.
        type: string
        default: "."
      java-version:
        type: string
        default: "17"
      java-distribution:
        type: string
        default: temurin
      android-packages:
        description: >
          Space-separated sdkmanager packages, e.g. "platforms;android-36 build-tools;36.0.0".
          AGP fetches anything missing itself; listing them keeps that out of the Gradle log.
        type: string
        default: platform-tools
      setup-cmd:
        description: >
          Runs in the repository root before Gradle, e.g. "npm install && npx cap sync android".
          Empty string skips the step.
        type: string
        default: ""
      gradle-tasks:
        description: >
          Tasks (and flags) for ./gradlew --no-daemon, e.g. ":app:testDebugUnitTest :app:assembleDebug".
          Empty string skips Gradle.
        type: string
        default: "testDebugUnitTest assembleDebug"
      artifact-path:
        description: >
          Glob to upload after the build, relative to the repository root, e.g.
          app/build/outputs/apk/debug/*.apk. Empty string skips the upload.
        type: string
        default: ""
      artifact-name:
        type: string
        default: app-debug
      runs-on:
        description: >
          Empty picks the variable RUNNER_LINUX (Blacksmith, x86_64, which Android
          build-tools need for aapt2) and falls back to ubuntu-latest.
        type: string
        default: ""

jobs:
  # The PR title becomes the squash-commit subject that release-please reads.
  # Same regex as .githooks/commit-msg. Skipped on push.
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ${{ fromJSON(vars.RUNNER_LINUX || '"ubuntu-latest"') }}
    timeout-minutes: 5
    steps:
      - name: conventional title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        shell: bash
        run: |
          types='feat|fix|chore|docs|refactor|test|ci|build|perf|style|revert'
          if printf '%s\n' "$TITLE" | grep -Eq "^($types)(\([A-Za-z0-9._/-]+\))?!?: .+"; then
            echo "ok: $TITLE"
          else
            echo "::error title=PR title::'$TITLE' is not a conventional commit: <type>(<scope>)!: <subject>, type one of $types"
            exit 1
          fi

  # Markdown-only changes skip ci (actions/code-changed); pr-title and the caller's hooks job
  # still run, since they lint titles and docs.
  changes:
    runs-on: ${{ fromJSON(vars.RUNNER_LINUX || '"ubuntu-latest"') }}
    timeout-minutes: 10
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      - id: files
        uses: JakobMelchard/.github/actions/code-changed@main

  ci:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ inputs.runs-on || fromJSON(vars.RUNNER_LINUX || '"ubuntu-latest"') }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }

      - name: provenance
        # Which commit of JakobMelchard/.github defined this job. job.workflow_ref and
        # job.workflow_sha (GitHub, Sept 2026) are read through toJSON because
        # actionlint's job-context type does not know them yet.
        env:
          JOB: ${{ toJSON(job) }}
        shell: bash
        run: |
          ref=$(jq -r '.workflow_ref // "unknown"' <<<"$JOB")
          sha=$(jq -r '.workflow_sha // "unknown"' <<<"$JOB")
          echo "reusable workflow: $ref @ $sha"
          echo "Reusable workflow: \`$ref\` @ \`$sha\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: ${{ inputs.java-distribution }}
          java-version: ${{ inputs.java-version }}

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: ${{ inputs.android-packages }}
          log-accepted-android-sdk-licenses: false

      # v6 defaults to a proprietary caching component (gradle.com terms of use, preview-only
      # for private repos). cache-provider: basic keeps the open-source actions/cache path.
      # basic caching keys on the Gradle files and fails without any (lint.yml's smoke job has none)
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        if: hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') != ''
        with:
          cache-provider: basic

      - name: setup
        if: inputs.setup-cmd != ''
        env:
          CMD: ${{ inputs.setup-cmd }}
        shell: bash
        run: eval "$CMD"

      - name: gradle
        if: inputs.gradle-tasks != ''
        working-directory: ${{ inputs.working-directory }}
        env:
          TASKS: ${{ inputs.gradle-tasks }}
        shell: bash
        # TASKS is split into words on purpose: it is a task list, not one argument.
        run: |
          chmod +x gradlew
          # shellcheck disable=SC2086
          ./gradlew --no-daemon $TASKS

      - name: upload
        if: always() && inputs.artifact-path != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.artifact-path }}
          if-no-files-found: ignore
