name: android

# Reusable Android (Gradle) CI on a Linux runner: SDK setup, Gradle tasks, artifact upload.
# Skips ci for Markdown-only changes.
#
#   jobs:
#     ci:
#       uses: JakobMelchard/.github/.github/workflows/android.yml@vX.Y.Z
#       with: { artifact-path: app/build/outputs/apk/debug/*.apk }

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory holding gradlew. Only the gradle step runs there; setup-cmd runs in the repository root.
        type: string
        default: "."
      java-version:
        description: JDK version for actions/setup-java.
        type: string
        default: "17"
      java-distribution:
        description: setup-java distribution.
        type: string
        default: temurin
      android-packages:
        description: >
          Space-separated sdkmanager packages, e.g. "platforms;android-36 build-tools;36.0.0".
          AGP fetches anything missing itself; listing them keeps that out of the Gradle log.
        type: string
        default: platform-tools
      setup-cmd:
        description: >
          Runs in the repository root before Gradle, e.g. "npm install && npx cap sync android".
          Empty skips the step.
        type: string
        default: ""
      gradle-tasks:
        description: >
          Tasks and flags for `./gradlew --no-daemon`, split on spaces, e.g.
          ":app:testDebugUnitTest :app:assembleDebug". Empty skips Gradle.
        type: string
        default: "testDebugUnitTest assembleDebug"
      artifact-path:
        description: >
          Glob to upload after the build, relative to the repository root, e.g.
          app/build/outputs/apk/debug/*.apk. Uploaded even when Gradle failed. Empty skips the upload.
        type: string
        default: ""
      artifact-name:
        description: Name of the uploaded artifact.
        type: string
        default: app-debug
      runs-on:
        description: >
          Runner label for the ci job only (pr-title and changes always use RUNNER_LINUX).
          Empty picks the variable RUNNER_LINUX (Blacksmith, x86_64, which Android build-tools
          need for aapt2) and falls back to Blacksmith (ubuntu-latest outside JakobMelchard).
        type: string
        default: ""

jobs:
  # The title becomes the squash commit that release-please reads; same regex as .githooks/commit-msg.
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ${{ fromJSON(vars.RUNNER_LINUX || (github.repository_owner == 'JakobMelchard' && '"blacksmith-2vcpu-ubuntu-2404"' || '"ubuntu-latest"')) }}
    timeout-minutes: 5
    steps:
      - name: conventional title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        shell: bash
        run: |
          types='feat|fix|chore|docs|refactor|test|ci|build|perf|style|revert'
          if printf '%s\n' "$TITLE" | grep -Eq "^($types)(\([A-Za-z0-9._/-]+\))?!?: .+"; then
            echo "ok: $TITLE"
          else
            echo "::error title=PR title::'$TITLE' is not a conventional commit: <type>(<scope>)!: <subject>, type one of $types"
            exit 1
          fi

  changes:
    runs-on: ${{ fromJSON(vars.RUNNER_LINUX || (github.repository_owner == 'JakobMelchard' && '"blacksmith-2vcpu-ubuntu-2404"' || '"ubuntu-latest"')) }}
    timeout-minutes: 10
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      - id: files
        uses: JakobMelchard/.github/actions/code-changed@main

  ci:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ inputs.runs-on || fromJSON(vars.RUNNER_LINUX || (github.repository_owner == 'JakobMelchard' && '"blacksmith-2vcpu-ubuntu-2404"' || '"ubuntu-latest"')) }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }

      - name: provenance
        # job.workflow_ref and job.workflow_sha are read through toJSON: actionlint's job context lacks them.
        env:
          JOB: ${{ toJSON(job) }}
        shell: bash
        run: |
          ref=$(jq -r '.workflow_ref // "unknown"' <<<"$JOB")
          sha=$(jq -r '.workflow_sha // "unknown"' <<<"$JOB")
          echo "reusable workflow: $ref @ $sha"
          echo "Reusable workflow: \`$ref\` @ \`$sha\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: ${{ inputs.java-distribution }}
          java-version: ${{ inputs.java-version }}

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: ${{ inputs.android-packages }}
          log-accepted-android-sdk-licenses: false

      # v6 defaults to a proprietary cache component; `basic` keeps actions/cache. It keys on the
      # Gradle files and fails without any, hence the hashFiles guard.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        if: hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') != ''
        with:
          cache-provider: basic

      - name: setup
        if: inputs.setup-cmd != ''
        env:
          CMD: ${{ inputs.setup-cmd }}
        shell: bash
        run: eval "$CMD"

      - name: gradle
        if: inputs.gradle-tasks != ''
        working-directory: ${{ inputs.working-directory }}
        env:
          TASKS: ${{ inputs.gradle-tasks }}
        shell: bash
        # TASKS is split into words on purpose.
        run: |
          chmod +x gradlew
          # shellcheck disable=SC2086
          ./gradlew --no-daemon $TASKS

      - name: upload
        if: always() && inputs.artifact-path != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.artifact-path }}
          if-no-files-found: ignore
