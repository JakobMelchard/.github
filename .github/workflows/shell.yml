name: shell

# Reusable shell CI: syntax check and shellcheck over every script with a bash, sh or zsh
# shebang under paths (extensionless bin/ scripts included). zsh scripts get the syntax check only.
#
#   jobs:
#     shell:
#       uses: JakobMelchard/.github/.github/workflows/shell.yml@vX.Y.Z
#       with: { paths: scripts }

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      paths:
        description: Space-separated roots to scan. .git, node_modules and .venv are skipped.
        type: string
        default: "."
      severity:
        description: shellcheck minimum severity (error, warning, info or style).
        type: string
        default: warning
      runs-on:
        description: >
          Runner for every job, as JSON: '"ubuntu-latest"' or '["self-hosted","macOS"]'.
          Empty picks the repo variable RUNNER_LINUX and falls back to ubuntu-latest.
        type: string
        default: ""
      fold:
        description: >
          Run the title check as the first step of ci and skip the pr-title and changes jobs: one VM
          boot instead of three. ci then also runs for Markdown-only changes. Require the ci check, not
          only pr-title, in branch protection: a failing title fails ci, and the skipped pr-title passes.
        type: boolean
        default: false

jobs:
  # The title becomes the squash commit that release-please reads; same regex as the .githooks conventional-commit hook.
  pr-title:
    timeout-minutes: 5
    if: ${{ github.event_name == 'pull_request' && !inputs.fold }}
    runs-on: ${{ fromJSON(inputs.runs-on || vars.RUNNER_LINUX || '"ubuntu-latest"') }}
    concurrency:
      group: shell-pr-title-${{ inputs.paths }}-${{ inputs.fold }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: JakobMelchard/.github/actions/scripts@131a9a7cd081fa4bc30044fa2c661ad11c988e60 # v2.8.0
      - name: conventional title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: jm-pr-title

  changes:
    if: ${{ !inputs.fold }}
    timeout-minutes: 10
    runs-on: ${{ fromJSON(inputs.runs-on || vars.RUNNER_LINUX || '"ubuntu-latest"') }}
    concurrency:
      group: shell-changes-${{ inputs.paths }}-${{ inputs.fold }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      - id: files
        uses: JakobMelchard/.github/actions/code-changed@131a9a7cd081fa4bc30044fa2c661ad11c988e60 # v2.8.0

  ci:
    timeout-minutes: 30
    needs: changes
    if: ${{ !cancelled() && (inputs.fold || needs.changes.outputs.code == 'true') }}
    runs-on: ${{ fromJSON(inputs.runs-on || vars.RUNNER_LINUX || '"ubuntu-latest"') }}
    concurrency:
      group: shell-ci-${{ inputs.paths }}-${{ inputs.fold }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - if: ${{ inputs.fold && github.event_name == 'pull_request' }}
        uses: JakobMelchard/.github/actions/scripts@131a9a7cd081fa4bc30044fa2c661ad11c988e60 # v2.8.0
      - name: conventional title
        if: ${{ inputs.fold && github.event_name == 'pull_request' }}
        working-directory: ${{ github.workspace }}
        shell: bash
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: jm-pr-title

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }

      - uses: JakobMelchard/.github/actions/scripts@131a9a7cd081fa4bc30044fa2c661ad11c988e60 # v2.8.0

      - name: provenance
        # job.workflow_ref and job.workflow_sha are read through toJSON: actionlint's job context lacks them.
        env:
          JOB: ${{ toJSON(job) }}
        shell: bash
        run: |
          ref=$(jq -r '.workflow_ref // "unknown"' <<<"$JOB")
          sha=$(jq -r '.workflow_sha // "unknown"' <<<"$JOB")
          echo "reusable workflow: $ref @ $sha"
          echo "Reusable workflow: \`$ref\` @ \`$sha\`" >> "$GITHUB_STEP_SUMMARY"

      - name: collect shell scripts
        id: collect
        env:
          PATHS: ${{ inputs.paths }}
        run: jm-shell-collect

      - name: syntax check
        if: steps.collect.outputs.count != '0'
        run: jm-shell-syntax

      - name: shellcheck
        if: steps.collect.outputs.count != '0'
        env:
          SEVERITY: ${{ inputs.severity }}
        run: jm-shellcheck
