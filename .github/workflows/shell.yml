name: shell

# Reusable shell CI. Callers: bin, monitor, infra.
# bin/ scripts are extensionless with shebangs, so globbing on *.sh is not enough —
# detect by shebang instead.

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      paths:
        description: Space-separated roots to scan.
        type: string
        default: "."
      severity:
        description: shellcheck minimum severity (error|warning|info|style).
        type: string
        default: warning
      runs-on:
        type: string
        default: ubuntu-latest

jobs:
  # The PR title becomes the squash-commit subject that release-please reads.
  # Same regex as .githooks/commit-msg. Skipped on push.
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: conventional title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        shell: bash
        run: |
          types='feat|fix|chore|docs|refactor|test|ci|build|perf|style|revert'
          if printf '%s\n' "$TITLE" | grep -Eq "^($types)(\([A-Za-z0-9._/-]+\))?!?: .+"; then
            echo "ok: $TITLE"
          else
            echo "::error title=PR title::'$TITLE' is not a conventional commit: <type>(<scope>)!: <subject>, type one of $types"
            exit 1
          fi

  ci:
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }

      - name: provenance
        # Which commit of JakobMelchard/.github defined this job. job.workflow_ref and
        # job.workflow_sha (GitHub, Sept 2026) are read through toJSON because
        # actionlint's job-context type does not know them yet.
        env:
          JOB: ${{ toJSON(job) }}
        shell: bash
        run: |
          ref=$(jq -r '.workflow_ref // "unknown"' <<<"$JOB")
          sha=$(jq -r '.workflow_sha // "unknown"' <<<"$JOB")
          echo "reusable workflow: $ref @ $sha"
          echo "Reusable workflow: \`$ref\` @ \`$sha\`" >> "$GITHUB_STEP_SUMMARY"

      - name: collect shell scripts
        id: collect
        env:
          PATHS: ${{ inputs.paths }}
        run: |
          : > /tmp/scripts.txt
          # shellcheck disable=SC2086 # space-separated roots by contract
          for root in $PATHS; do
            while IFS= read -r f; do
              case "$(head -c 2 "$f")" in
                '#!') head -1 "$f" | grep -qE '^#!.*(bash|sh|zsh)' && echo "$f" >> /tmp/scripts.txt ;;
              esac
            done < <(find "$root" -type f -not -path '*/.git/*' -not -path '*/node_modules/*' -not -path '*/.venv/*')
          done
          sort -u /tmp/scripts.txt -o /tmp/scripts.txt
          echo "count=$(wc -l < /tmp/scripts.txt)" >> "$GITHUB_OUTPUT"
          echo "found $(wc -l < /tmp/scripts.txt) scripts:"
          cat /tmp/scripts.txt
        shell: bash

      - name: syntax check
        if: steps.collect.outputs.count != '0'
        run: |
          # ubuntu-latest has no zsh
          command -v zsh >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq zsh; }
          rc=0
          while IFS= read -r f; do
            case "$(head -1 "$f")" in
              *zsh) zsh -n "$f" || rc=1 ;;
              *)    bash -n "$f" || rc=1 ;;
            esac
          done < /tmp/scripts.txt
          exit $rc
        shell: bash

      - name: shellcheck
        if: steps.collect.outputs.count != '0'
        env:
          SEVERITY: ${{ inputs.severity }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          # zsh is out of shellcheck's scope; skip those.
          rc=0
          while IFS= read -r f; do
            head -1 "$f" | grep -q zsh && continue
            shellcheck --severity="$SEVERITY" "$f" || rc=1
          done < /tmp/scripts.txt
          exit $rc
        shell: bash
