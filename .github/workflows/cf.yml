name: cf

# Reusable `wrangler deploy` for a Cloudflare Worker with a Durable Object, so the migration is
# applied by the same deploy. Workers without one deploy through Workers Builds. The caller
# grants contents: read and id-token: write (Infisical OIDC, needed even with dry-run) and gates
# on the main branch, which is the only ref the Infisical identity accepts besides dev.
#
#   jobs:
#     deploy:
#       if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
#       uses: JakobMelchard/.github/.github/workflows/cf.yml@vX.Y.Z
#       permissions: { contents: read, id-token: write }

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory with the wrangler config. Every run step executes there.
        type: string
        default: "."
      environment:
        description: >
          wrangler --env name. Empty deploys the top-level environment. Not a GitHub
          environment: that would change the OIDC subject, and the Infisical identity only
          accepts main and dev.
        type: string
        default: ""
      wrangler-version:
        description: >
          Empty runs the wrangler the repo locked (`npx --no-install`, so a missing one fails
          instead of fetching latest). A version such as "4.143.0" runs `npx wrangler@<version>`,
          fetched before the credentials are loaded.
        type: string
        default: ""
      dry-run:
        description: >
          `wrangler deploy --dry-run`: bundles and prints bindings, publishes nothing.
          Skips the Infisical step, so it needs no credentials.
        type: boolean
        default: false
      account-id:
        description: Exported as CLOUDFLARE_ACCOUNT_ID when set. Needed when the token sees more than one account. Not a secret.
        type: string
        default: ""
      node-version:
        description: Node version for actions/setup-node.
        type: string
        default: "24"
      install-cmd:
        description: Runs before the credentials are loaded, so install scripts never see them. Empty skips the step.
        type: string
        default: "npm ci"

jobs:
  deploy:
    runs-on: ${{ fromJSON(vars.RUNNER_LINUX || '"ubuntu-latest"') }}
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    # One deploy per directory and environment; a second push waits instead of racing the first.
    concurrency:
      group: cf-${{ inputs.working-directory }}-${{ inputs.environment || 'default' }}${{ inputs.dry-run && '-dry' || '' }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }

      - name: provenance
        # job.workflow_ref and job.workflow_sha are read through toJSON: actionlint's job context lacks them.
        env:
          JOB: ${{ toJSON(job) }}
        shell: bash
        run: |
          ref=$(jq -r '.workflow_ref // "unknown"' <<<"$JOB")
          sha=$(jq -r '.workflow_sha // "unknown"' <<<"$JOB")
          echo "reusable workflow: $ref @ $sha"
          echo "Reusable workflow: \`$ref\` @ \`$sha\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}

      - name: install
        if: inputs.install-cmd != ''
        env:
          CMD: ${{ inputs.install-cmd }}
        shell: bash
        run: eval "$CMD"

      # Fetched before the token exists, so its install scripts never see it.
      - name: fetch wrangler
        if: inputs.wrangler-version != ''
        env:
          WRANGLER_VERSION: ${{ inputs.wrangler-version }}
        shell: bash
        run: |
          [[ "$WRANGLER_VERSION" =~ ^[A-Za-z0-9._-]*$ ]] || { echo "::error::bad wrangler-version '$WRANGLER_VERSION'"; exit 1; }
          npx --yes "wrangler@$WRANGLER_VERSION" --version

      # Loads CLOUDFLARE_API_TOKEN after install so lifecycle scripts never see it.
      - name: credentials
        if: ${{ !inputs.dry-run }}
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: 5bba3659-c0e6-4d26-9161-0cb72567c426 # gha-deploy: main and dev only
          domain: https://eu.infisical.com
          project-slug: cloudflare-a1s-e
          env-slug: dev

      - name: wrangler deploy
        env:
          WRANGLER_ENV: ${{ inputs.environment }}
          WRANGLER_VERSION: ${{ inputs.wrangler-version }}
          DRY_RUN: ${{ inputs.dry-run }}
          ACCOUNT_ID: ${{ inputs.account-id }}
          WRANGLER_SEND_METRICS: "false"
        shell: bash
        run: |
          [[ "$WRANGLER_ENV" =~ ^[A-Za-z0-9_-]*$ ]] || { echo "::error::bad environment '$WRANGLER_ENV'"; exit 1; }
          [[ "$WRANGLER_VERSION" =~ ^[A-Za-z0-9._-]*$ ]] || { echo "::error::bad wrangler-version '$WRANGLER_VERSION'"; exit 1; }
          [ -z "$ACCOUNT_ID" ] || export CLOUDFLARE_ACCOUNT_ID="$ACCOUNT_ID"
          if [ -n "$WRANGLER_VERSION" ]; then w=(npx --yes "wrangler@$WRANGLER_VERSION"); else w=(npx --no-install wrangler); fi
          args=(deploy)
          [ -z "$WRANGLER_ENV" ] || args+=(--env "$WRANGLER_ENV")
          [ "$DRY_RUN" != true ] || args+=(--dry-run)
          "${w[@]}" "${args[@]}"
