name: review-label

# Reusable bridge for review bots without a label allowlist. A repo's caller runs it on
# `pull_request: types: [labeled]`; labelling a ready PR "ai:cubic" posts `@cubic-dev-ai review`
# as the org app, then drops the label so it can be applied again for another review.
# CodeRabbit and Sourcery filter by label natively and need no workflow. The app token comes
# from Infisical (project gha, identity gha-org, OIDC), so the caller grants id-token: write.
#
#   on: { pull_request: { types: [labeled] } }
#   jobs:
#     review-label:
#       uses: JakobMelchard/.github/.github/workflows/review-label.yml@v1.6.0
#       permissions: { contents: read, id-token: write }

on:
  workflow_call:
    inputs:
      runs-on:
        description: >
          JSON runner spec, a quoted label or a label array, as in release.yml. Empty picks
          the org variable RUNNER_LINUX and falls back to ubuntu-latest.
        type: string
        default: ""

permissions: {}

jobs:
  cubic:
    if: >-
      github.event.label.name == 'ai:cubic' && !github.event.pull_request.draft &&
      github.event.sender.type != 'Bot' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON(inputs.runs-on || vars.RUNNER_LINUX || '"ubuntu-latest"') }}
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - name: fetch APP_CLIENT_ID
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: b1ede60d-f7a7-4699-86ec-eea6ac51be30 # gha-org
          domain: https://eu.infisical.com
          project-slug: gha-lfq-y
          env-slug: dev
          secret-name: APP_CLIENT_ID

      - name: fetch APP_PRIVATE_KEY
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: b1ede60d-f7a7-4699-86ec-eea6ac51be30 # gha-org
          domain: https://eu.infisical.com
          project-slug: gha-lfq-y
          env-slug: dev
          secret-name: APP_PRIVATE_KEY

      - name: mint app token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ env.APP_CLIENT_ID }}
          private-key: ${{ env.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-pull-requests: write
          permission-issues: write

      - name: request review
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUM: ${{ github.event.pull_request.number }}
        run: |
          # Remove the label first: if this fails nothing was requested and a retry is safe.
          gh pr edit "$PR_NUM" --remove-label ai:cubic
          gh pr comment "$PR_NUM" --body '@cubic-dev-ai review'
