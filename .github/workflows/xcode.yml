name: xcode

# Reusable Xcode CI for Apple apps and packages: generate, swift-format lint, xcodebuild test.
# Runs on a macOS runner (10x the Linux minute cost), so trigger it on pull_request and main only.
# An empty scheme skips xcodebuild.
#
#   jobs:
#     ci:
#       uses: JakobMelchard/.github/.github/workflows/xcode.yml@vX.Y.Z
#       with: { scheme: Attach, siblings: zmxkit }

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      scheme:
        description: Xcode scheme to build and test. Empty skips xcodebuild.
        type: string
        default: ""
      project:
        description: >
          .xcodeproj or .xcworkspace path. Empty picks the first one in working-directory
          after generate-cmd has run.
        type: string
        default: ""
      destination:
        description: xcodebuild -destination for the test run.
        type: string
        default: "platform=iOS Simulator,name=iPad Air 11-inch (M4)"
      generate-cmd:
        description: Runs before anything else, e.g. xcodegen for repos that git-ignore the .xcodeproj. Empty skips the step.
        type: string
        default: "if [ -f project.yml ]; then brew install xcodegen && xcodegen generate; fi"
      lint-cmd:
        description: Empty skips the step.
        type: string
        default: "xcrun swift-format lint --strict --recursive ."
      test-cmd:
        description: >
          Replaces the default `xcodebuild test` (built from scheme, project and destination)
          when set. Empty runs the default, or nothing when scheme is empty.
        type: string
        default: ""
      xcode-version:
        description: Xcode app to select, e.g. "26.0". Empty keeps the runner default.
        type: string
        default: ""
      siblings:
        description: >
          Space-separated public JakobMelchard repos to clone next to the checkout, as name or
          name@ref (default ref main), mirroring the local ~/Workspaces/JakobMelchard layout.
          For projects that include or depend on a sibling checkout by path.
        type: string
        default: ""
      working-directory:
        description: Directory every run step executes in.
        type: string
        default: "."
      runs-on:
        description: >
          Empty picks the org variable RUNNER_MACOS (self-hosted on mimi, visible to
          private repos only) and falls back to macos-latest.
        type: string
        default: ""

jobs:
  # Same regex as the .githooks conventional-commit hook. Runs on the build's Mac runner: a hosted Linux runner
  # would be the only metered job here.
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ${{ inputs.runs-on || fromJSON(vars.RUNNER_MACOS || '"macos-latest"') }}
    timeout-minutes: 5
    steps:
      - uses: JakobMelchard/.github/actions/scripts@88bfcf0fb6db99ff67f1e0e8f082f9b7e391028d # v2.4.1
      - name: conventional title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: jm-pr-title

  ci:
    runs-on: ${{ inputs.runs-on || fromJSON(vars.RUNNER_MACOS || '"macos-latest"') }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }

      - uses: JakobMelchard/.github/actions/scripts@88bfcf0fb6db99ff67f1e0e8f082f9b7e391028d # v2.4.1

      - name: clone sibling repos
        if: inputs.siblings != ''
        working-directory: ${{ github.workspace }}
        env:
          SIBLINGS: ${{ inputs.siblings }}
        run: jm-clone-siblings

      - name: provenance
        # job.workflow_ref and job.workflow_sha are read through toJSON: actionlint's job context lacks them.
        env:
          JOB: ${{ toJSON(job) }}
        shell: bash
        run: |
          ref=$(jq -r '.workflow_ref // "unknown"' <<<"$JOB")
          sha=$(jq -r '.workflow_sha // "unknown"' <<<"$JOB")
          echo "reusable workflow: $ref @ $sha"
          echo "Reusable workflow: \`$ref\` @ \`$sha\`" >> "$GITHUB_STEP_SUMMARY"

      - name: select xcode
        if: inputs.xcode-version != ''
        env:
          XCODE: ${{ inputs.xcode-version }}
        shell: bash
        run: |
          sudo xcode-select -s "/Applications/Xcode_${XCODE}.app"
          xcodebuild -version

      - name: generate
        if: inputs.generate-cmd != ''
        env:
          CMD: ${{ inputs.generate-cmd }}
        shell: bash
        run: eval "$CMD"

      - name: lint
        if: inputs.lint-cmd != ''
        env:
          CMD: ${{ inputs.lint-cmd }}
        shell: bash
        run: eval "$CMD"

      # Runner images can ship without iOS simulators, so create the device the destination
      # names (or a `name=` inside test-cmd), downloading the iOS runtime first if none exists.
      - name: simulator
        if: inputs.test-cmd != '' || inputs.scheme != ''
        env:
          CMD: ${{ inputs.test-cmd }}
          DEST: ${{ inputs.destination }}
        run: jm-xcode-simulator

      - name: test
        if: inputs.test-cmd != '' || inputs.scheme != ''
        env:
          CMD: ${{ inputs.test-cmd }}
          SCHEME: ${{ inputs.scheme }}
          PROJECT: ${{ inputs.project }}
          DEST: ${{ inputs.destination }}
        shell: bash
        run: if [ -n "$CMD" ]; then eval "$CMD"; else jm-xcodebuild-test; fi

      - name: xcodebuild log
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xcodebuild-log
          path: ${{ inputs.working-directory }}/xcodebuild.log
          if-no-files-found: ignore
