name: xcode

# Reusable Xcode CI for Apple apps and packages.
#
#   jobs:
#     ci:
#       uses: JakobMelchard/.github/.github/workflows/xcode.yml@main
#       with:
#         scheme: Attach
#         runs-on: self-hosted
#
# Inputs (all optional):
#   scheme            string, default ""   Xcode scheme for the default `xcodebuild test`. Empty skips
#                                          that default test; the simulator step may still run.
#   project           string, default ""   .xcodeproj or .xcworkspace path. Empty picks the first
#                                          workspace, else project, in working-directory after
#                                          generate-cmd ran.
#   destination       string, default "platform=iOS Simulator,name=iPad Air 11-inch (M4)"
#                                          xcodebuild -destination; also names the simulator the
#                                          simulator step creates when it is missing.
#   generate-cmd      string, default xcodegen if project.yml exists, else nothing
#                                          Runs first (after xcode-version). "" skips the step.
#   lint-cmd          string, default "xcrun swift-format lint --strict --recursive ."
#                                          Runs second. "" skips the step.
#   test-cmd          string, default ""   Replaces the default `xcodebuild test` when set. Empty runs
#                                          the default, or nothing when scheme is empty. Also read by
#                                          the simulator step to find a `name=` to create.
#   xcode-version     string, default ""   Selects /Applications/Xcode_<version>.app, e.g. "26.6".
#                                          Empty keeps the runner default.
#   siblings          string, default ""   Space-separated public JakobMelchard repos, name or
#                                          name@ref (default main), cloned next to the checkout.
#   working-directory string, default "."  Every run step of ci executes there, except the sibling
#                                          clone step, which runs from github.workspace and clones
#                                          beside the checkout. The xcodebuild log artifact is read
#                                          from it.
#   runs-on           string, default ""   One runner label (no fromJSON), for pr-title and ci. Empty
#                                          picks the org variable RUNNER_MACOS (self-hosted on mimi,
#                                          private org repos only) and falls back to macos-latest.
#
# Secrets: none. Outputs: none. Artifact: xcodebuild-log (xcodebuild.log, only on failure or timeout).
#
# Jobs: pr-title (pull_request only: Conventional Commits check, 5 min), ci (60 min). Both run on the macOS runner
# (10x the Linux minute cost on the free plan), so callers should trigger it on pull_request and
# main only and filter with `paths`: unlike the language workflows there is no markdown-only gate.
# Each *-cmd runs through eval in bash. Steps in order: checkout, siblings, provenance, select
# xcode, generate, lint, simulator, test, xcodebuild log.
#
# Callers (scan 2026-10-11, both accounts):
#   lilfeelz/workspaces attach-ci.yml (v1.3.0): scheme, working-directory, runs-on=self-hosted.
#   lilfeelz/keyboard kanata-ios.yml (v1.4.0): working-directory, scheme, runs-on=macos-26,
#     xcode-version, test-cmd.
#   JakobMelchard/workouts-go ci.yml ios job (v1.3.0): runs-on=self-hosted, working-directory,
#     generate-cmd, lint-cmd "", test-cmd.
#   JakobMelchard/template ci.yml.jinja: ios job as workouts-go (v1.6.0); macos template passes
#     scheme and destination=platform=macOS.
#   This repo: lint.yml smoke-xcode (scheme "", generate-cmd "", lint-cmd "") and smoke-simulator
#     (generate-cmd "", lint-cmd "", test-cmd printing a destination).
#   Never passed by any caller: project, siblings. The former callers zmxapp and zmxkit no longer
#   exist.

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      scheme:
        description: Xcode scheme to build and test. Empty skips xcodebuild.
        type: string
        default: ""
      project:
        description: >
          .xcodeproj or .xcworkspace path. Empty picks the first one in working-directory
          after generate-cmd has run.
        type: string
        default: ""
      destination:
        description: xcodebuild -destination for the test run.
        type: string
        default: "platform=iOS Simulator,name=iPad Air 11-inch (M4)"
      generate-cmd:
        description: Runs before anything else, e.g. xcodegen for repos that git-ignore the .xcodeproj.
        type: string
        default: "if [ -f project.yml ]; then brew install xcodegen && xcodegen generate; fi"
      lint-cmd:
        description: Empty string skips the step.
        type: string
        default: "xcrun swift-format lint --strict --recursive ."
      test-cmd:
        description: >
          Replaces the default `xcodebuild test` (built from scheme/project/destination)
          when set. Empty runs the default, or nothing when scheme is empty.
        type: string
        default: ""
      xcode-version:
        description: Xcode app to select, e.g. "26.0". Empty keeps the runner default.
        type: string
        default: ""
      siblings:
        description: >
          Space-separated public JakobMelchard repos to clone next to the checkout, as
          name or name@ref (default ref main), mirroring the local ~/Workspaces/JakobMelchard
          layout. For projects that include or depend on a sibling checkout by path.
        type: string
        default: ""
      working-directory:
        type: string
        default: "."
      runs-on:
        description: >
          Empty picks the org variable RUNNER_MACOS (self-hosted on mimi, visible to
          private repos only) and falls back to macos-latest.
        type: string
        default: ""

jobs:
  # The PR title becomes the squash-commit subject that release-please reads.
  # Same regex as .githooks/commit-msg. Skipped on push. Runs on the same runner
  # as the build: Xcode callers already have the Mac runner on mimi, and a hosted
  # Linux runner would be the only metered job in the workflow.
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ${{ inputs.runs-on || fromJSON(vars.RUNNER_MACOS || '"macos-latest"') }}
    timeout-minutes: 5
    steps:
      - name: conventional title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        shell: bash
        run: |
          types='feat|fix|chore|docs|refactor|test|ci|build|perf|style|revert'
          if printf '%s\n' "$TITLE" | grep -Eq "^($types)(\([A-Za-z0-9._/-]+\))?!?: .+"; then
            echo "ok: $TITLE"
          else
            echo "::error title=PR title::'$TITLE' is not a conventional commit: <type>(<scope>)!: <subject>, type one of $types"
            exit 1
          fi

  ci:
    runs-on: ${{ inputs.runs-on || fromJSON(vars.RUNNER_MACOS || '"macos-latest"') }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }

      - name: clone sibling repos
        if: inputs.siblings != ''
        working-directory: ${{ github.workspace }}
        env:
          SIBLINGS: ${{ inputs.siblings }}
        shell: bash
        run: |
          for s in $SIBLINGS; do
            [[ "$s" =~ ^[A-Za-z0-9._-]+(@[A-Za-z0-9._/-]+)?$ ]] || { echo "::error::bad sibling '$s'"; exit 1; }
            name=${s%%@*}; ref=main; [[ "$s" == *@* ]] && ref=${s#*@}
            git clone -q --depth 1 --branch "$ref" "https://github.com/JakobMelchard/$name.git" "../$name"
            echo "sibling $name @ $ref -> $(git -C "../$name" rev-parse --short HEAD)"
          done

      - name: provenance
        # Which commit of JakobMelchard/.github defined this job. job.workflow_ref and
        # job.workflow_sha (GitHub, Sept 2026) are read through toJSON because
        # actionlint's job-context type does not know them yet.
        env:
          JOB: ${{ toJSON(job) }}
        shell: bash
        run: |
          ref=$(jq -r '.workflow_ref // "unknown"' <<<"$JOB")
          sha=$(jq -r '.workflow_sha // "unknown"' <<<"$JOB")
          echo "reusable workflow: $ref @ $sha"
          echo "Reusable workflow: \`$ref\` @ \`$sha\`" >> "$GITHUB_STEP_SUMMARY"

      - name: select xcode
        if: inputs.xcode-version != ''
        env:
          XCODE: ${{ inputs.xcode-version }}
        shell: bash
        run: |
          sudo xcode-select -s "/Applications/Xcode_${XCODE}.app"
          xcodebuild -version

      - name: generate
        if: inputs.generate-cmd != ''
        env:
          CMD: ${{ inputs.generate-cmd }}
        shell: bash
        run: eval "$CMD"

      - name: lint
        if: inputs.lint-cmd != ''
        env:
          CMD: ${{ inputs.lint-cmd }}
        shell: bash
        run: eval "$CMD"

      # Runner images can ship without iOS simulators (macos-latest with Xcode 26.6 lists only
      # placeholders), so create the device the destination names, downloading the iOS
      # runtime first when none is installed. The name comes from destination, or from a
      # `name=` inside test-cmd.
      - name: simulator
        if: inputs.test-cmd != '' || inputs.scheme != ''''
        env:
          CMD: ${{ inputs.test-cmd }}
          DEST: ${{ inputs.destination }}
        shell: bash
        run: |
          spec="$DEST"; [ -n "$CMD" ] && spec="$CMD"
          case "$spec" in *"iOS Simulator"*) ;; *) echo "no iOS Simulator destination"; exit 0 ;; esac
          name=$(printf '%s' "$spec" | sed -nE "s/.*name=([^,'\"]+).*/\1/p")
          [ -n "$name" ] || { echo "no simulator name in the destination"; exit 0; }
          if xcrun simctl list devices available | grep -qF "    $name ("; then echo "simulator '$name' present"; exit 0; fi
          rt() {
            xcrun simctl list runtimes available -j |
              jq -c '[.runtimes[] | select(.platform == "iOS")] | sort_by(.version | split(".") | map(tonumber)) | last // empty'
          }
          runtime=$(rt)
          if [ -z "$runtime" ]; then
            echo "no iOS runtime installed; downloading one"
            xcodebuild -downloadPlatform iOS
            runtime=$(rt)
          fi
          [ -n "$runtime" ] || { echo "::error::no iOS simulator runtime available"; exit 1; }
          rid=$(jq -r .identifier <<<"$runtime")
          # a device type the runtime supports: the named one, else its newest iPad
          type=$(jq -r --arg n "$name" '.supportedDeviceTypes[] | select(.name == $n) | .identifier' <<<"$runtime" | head -1)
          if [ -z "$type" ]; then
            type=$(jq -r '[.supportedDeviceTypes[] | select(.productFamily == "iPad")] | last | .identifier // empty' <<<"$runtime")
            [ -n "$type" ] || { echo "::error::$rid supports no iPad device type"; exit 1; }
            echo "::warning::$rid has no device type named '$name'; creating it as $type"
          fi
          udid=$(xcrun simctl create "$name" "$type" "$rid")
          echo "created '$name' ($type, $rid): $udid"

      - name: test
        if: inputs.test-cmd != '' || inputs.scheme != ''
        env:
          CMD: ${{ inputs.test-cmd }}
          SCHEME: ${{ inputs.scheme }}
          PROJECT: ${{ inputs.project }}
          DEST: ${{ inputs.destination }}
        shell: bash
        run: |
          if [ -n "$CMD" ]; then eval "$CMD"; exit; fi
          p="$PROJECT"
          if [ -z "$p" ]; then
            for f in ./*.xcworkspace ./*.xcodeproj; do [ -d "$f" ] && { p=$f; break; }; done
          fi
          [ -n "$p" ] || { echo "::error::no .xcodeproj/.xcworkspace found" >&2; exit 1; }
          case "$p" in *.xcworkspace) flag=-workspace ;; *) flag=-project ;; esac
          set -o pipefail
          xcodebuild "$flag" "$p" -scheme "$SCHEME" -destination "$DEST" \
            -skipMacroValidation -skipPackagePluginValidation \
            test 2>&1 | tee xcodebuild.log | grep -E 'error:|warning: |Test Suite|Test Case|Executed|\*\*'

      - name: xcodebuild log
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xcodebuild-log
          path: ${{ inputs.working-directory }}/xcodebuild.log
          if-no-files-found: ignore
