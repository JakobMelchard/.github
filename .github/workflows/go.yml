name: go

# Reusable Go CI.
#
#   jobs:
#     ci:
#       uses: JakobMelchard/.github/.github/workflows/go.yml@main
#       with:
#         go-version: "1.26"
#       secrets: inherit          # only if the repo needs private modules
#
# Inputs (all optional):
#   go-version        string,  default "1.25"          Go toolchain for actions/setup-go.
#   working-directory string,  default "."            Module root; every run step executes there and
#                                                      go.sum caching is keyed on it (off when absent).
#   vet-cmd           string,  default "go vet ./..."  Runs first. "" skips the step.
#   test-cmd          string,  default "go test ./..." Runs second. "" skips the step.
#   build-cmd         string,  default "go build ./..." Runs last. "" skips the step.
#   runs-on           string,  default ""              Runner label for the ci job only (pr-title and
#                                                      changes always use RUNNER_LINUX). Empty picks the
#                                                      org variable RUNNER_LINUX (self-hosted on mimi,
#                                                      private repos only) and falls back to ubuntu-latest.
#   private-modules   boolean, default false           Set GOPRIVATE to the owner's repos and wire a
#                                                      token into git so private modules resolve.
#   private-repos     string,  default ""              Comma/newline-separated repos the minted app token
#                                                      may read, e.g. "gsheet". Only with app secrets.
#
# Secrets (all optional, only read when private-modules is true): app-client-id and app-private-key
# (GitHub App, preferred), else token (PAT), else the job's github.token.
#
# Jobs: pr-title (pull_request only: Conventional Commits check), changes (skips ci for markdown-only
# diffs), ci. Each *-cmd runs through eval in bash.
#
# Callers: JakobMelchard/drill (defaults), JakobMelchard/lists and JakobMelchard/workouts-go
# (go-version, vet-cmd, test-cmd, build-cmd), JakobMelchard/workline (defaults, pinned v1.3.0).

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      go-version:
        description: Go toolchain version.
        type: string
        default: "1.25"
      working-directory:
        type: string
        default: "."
      vet-cmd:
        description: Empty string skips the step.
        type: string
        default: "go vet ./..."
      test-cmd:
        type: string
        default: "go test ./..."
      build-cmd:
        type: string
        default: "go build ./..."
      runs-on:
        description: >
          Empty picks the org variable RUNNER_LINUX (self-hosted on mimi, visible to
          private repos only) and falls back to ubuntu-latest.
        type: string
        default: ""
      private-modules:
        description: >
          Authenticate git so private JakobMelchard modules resolve.
          Supply either app credentials or a PAT (see secrets).
        type: boolean
        default: false
      private-repos:
        description: >
          Comma/newline-separated repos the minted app token may read,
          e.g. "gsheet". Only used with app credentials.
        type: string
        default: ""
    secrets:
      app-client-id:
        description: GitHub App client ID (preferred over a PAT — no expiry to babysit).
        required: false
      app-private-key:
        description: GitHub App private key. Presence of this selects the app path.
        required: false
      token:
        description: PAT fallback, used when no app private key is supplied.
        required: false

jobs:
  # The PR title becomes the squash-commit subject that release-please reads.
  # Same regex as .githooks/commit-msg. Skipped on push.
  pr-title:
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    runs-on: ${{ fromJSON(vars.RUNNER_LINUX || '"ubuntu-latest"') }}
    steps:
      - name: conventional title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        shell: bash
        run: |
          types='feat|fix|chore|docs|refactor|test|ci|build|perf|style|revert'
          if printf '%s\n' "$TITLE" | grep -Eq "^($types)(\([A-Za-z0-9._/-]+\))?!?: .+"; then
            echo "ok: $TITLE"
          else
            echo "::error title=PR title::'$TITLE' is not a conventional commit: <type>(<scope>)!: <subject>, type one of $types"
            exit 1
          fi

  # Markdown-only changes skip ci (actions/code-changed); pr-title and the caller's hooks job
  # still run, since they lint titles and docs.
  changes:
    timeout-minutes: 10
    runs-on: ${{ fromJSON(vars.RUNNER_LINUX || '"ubuntu-latest"') }}
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      - id: files
        uses: JakobMelchard/.github/actions/code-changed@main

  ci:
    timeout-minutes: 60
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ inputs.runs-on || fromJSON(vars.RUNNER_LINUX || '"ubuntu-latest"') }}
    env:
      # `secrets` is not available in a step-level `if`. Evaluate the
      # comparison here so only the boolean — never the key — is in env.
      HAS_APP: ${{ secrets.app-private-key != '' }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }

      - name: provenance
        # Which commit of JakobMelchard/.github defined this job. job.workflow_ref and
        # job.workflow_sha (GitHub, Sept 2026) are read through toJSON because
        # actionlint's job-context type does not know them yet.
        env:
          JOB: ${{ toJSON(job) }}
        shell: bash
        run: |
          ref=$(jq -r '.workflow_ref // "unknown"' <<<"$JOB")
          sha=$(jq -r '.workflow_sha // "unknown"' <<<"$JOB")
          echo "reusable workflow: $ref @ $sha"
          echo "Reusable workflow: \`$ref\` @ \`$sha\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go-version }}
          # A repo without go.sum at that path makes setup-go fail on an
          # unresolvable cache path — turn caching off in that case.
          cache: ${{ hashFiles(format('{0}/go.sum', inputs.working-directory)) != '' }}
          cache-dependency-path: ${{ inputs.working-directory }}/go.sum

      - name: mint app token
        id: app
        if: inputs.private-modules && env.HAS_APP == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.app-client-id }}
          private-key: ${{ secrets.app-private-key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ inputs.private-repos }}
          permission-contents: read

      # GOPRIVATE alone is not enough on a runner — git needs credentials too.
      - name: configure private module access
        if: inputs.private-modules
        env:
          TOKEN: ${{ steps.app.outputs.token || secrets.token || github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          go env -w GOPRIVATE="github.com/$OWNER/*"
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: vet
        if: inputs.vet-cmd != ''
        env:
          CMD: ${{ inputs.vet-cmd }}
        shell: bash
        run: eval "$CMD"

      - name: test
        if: inputs.test-cmd != ''
        env:
          CMD: ${{ inputs.test-cmd }}
        shell: bash
        run: eval "$CMD"

      - name: build
        if: inputs.build-cmd != ''
        env:
          CMD: ${{ inputs.build-cmd }}
        shell: bash
        run: eval "$CMD"
