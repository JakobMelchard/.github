name: go

# Reusable Go CI: vet, test, build. Skips ci for Markdown-only changes.
#
#   jobs:
#     ci:
#       uses: JakobMelchard/.github/.github/workflows/go.yml@vX.Y.Z
#       with: { test-cmd: make test }

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      go-version:
        description: Go toolchain version for actions/setup-go.
        type: string
        default: "1.25"
      working-directory:
        description: Module root. Every run step executes there; go.sum caching is keyed on it and off when absent.
        type: string
        default: "."
      vet-cmd:
        description: Runs first. Empty skips the step.
        type: string
        default: "go vet ./..."
      test-cmd:
        description: Runs second. Empty skips the step.
        type: string
        default: "go test ./..."
      build-cmd:
        description: Runs last. Empty skips the step.
        type: string
        default: "go build ./..."
      runs-on:
        description: >
          Runner label for the ci job only (pr-title and changes always use RUNNER_LINUX).
          Empty picks the org variable RUNNER_LINUX (self-hosted, visible to
          private repos only) and falls back to ubuntu-latest.
        type: string
        default: ""
      private-modules:
        description: >
          Set GOPRIVATE to the owner's repos and wire a token into git so private modules
          resolve. The token is the minted app token, else github.token.
        type: boolean
        default: false
      private-repos:
        description: >
          Comma or newline separated repos the minted app token may read, e.g. "gsheet".
          Only used with app credentials.
        type: string
        default: ""
    secrets:
      app-client-id:
        description: GitHub App client ID. Only read when private-modules is true.
        required: false
      app-private-key:
        description: GitHub App private key. Its presence selects the app path.
        required: false

jobs:
  # The title becomes the squash commit that release-please reads; same regex as the .githooks conventional-commit hook.
  pr-title:
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    runs-on: ${{ fromJSON(vars.RUNNER_LINUX || '"ubuntu-latest"') }}
    steps:
      - uses: JakobMelchard/.github/actions/scripts@88bfcf0fb6db99ff67f1e0e8f082f9b7e391028d # v2.4.1
      - name: conventional title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: jm-pr-title

  changes:
    timeout-minutes: 10
    runs-on: ${{ fromJSON(vars.RUNNER_LINUX || '"ubuntu-latest"') }}
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      - id: files
        uses: JakobMelchard/.github/actions/code-changed@88bfcf0fb6db99ff67f1e0e8f082f9b7e391028d # v2.4.1

  ci:
    timeout-minutes: 60
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ inputs.runs-on || fromJSON(vars.RUNNER_LINUX || '"ubuntu-latest"') }}
    env:
      # `secrets` is unavailable in a step-level `if`; expose only the boolean, never the key.
      HAS_APP: ${{ secrets.app-private-key != '' }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }

      - uses: JakobMelchard/.github/actions/scripts@88bfcf0fb6db99ff67f1e0e8f082f9b7e391028d # v2.4.1

      - name: provenance
        # job.workflow_ref and job.workflow_sha are read through toJSON: actionlint's job context lacks them.
        env:
          JOB: ${{ toJSON(job) }}
        shell: bash
        run: |
          ref=$(jq -r '.workflow_ref // "unknown"' <<<"$JOB")
          sha=$(jq -r '.workflow_sha // "unknown"' <<<"$JOB")
          echo "reusable workflow: $ref @ $sha"
          echo "Reusable workflow: \`$ref\` @ \`$sha\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go-version }}
          # A repo without go.sum at that path makes setup-go fail on an
          # unresolvable cache path: turn caching off in that case.
          cache: ${{ hashFiles(format('{0}/go.sum', inputs.working-directory)) != '' }}
          cache-dependency-path: ${{ inputs.working-directory }}/go.sum

      - name: mint app token
        id: app
        if: inputs.private-modules && env.HAS_APP == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.app-client-id }}
          private-key: ${{ secrets.app-private-key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ inputs.private-repos }}
          permission-contents: read

      # GOPRIVATE alone is not enough on a runner: git needs credentials too. GIT_CONFIG_* in the
      # job env, not ~/.gitconfig: a persistent runner would keep the token for later jobs.
      - name: configure private module access
        if: inputs.private-modules
        env:
          TOKEN: ${{ steps.app.outputs.token || github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          go env -w GOPRIVATE="github.com/$OWNER/*"
          jm-git-auth

      - name: vet
        if: inputs.vet-cmd != ''
        env:
          CMD: ${{ inputs.vet-cmd }}
        shell: bash
        run: eval "$CMD"

      - name: test
        if: inputs.test-cmd != ''
        env:
          CMD: ${{ inputs.test-cmd }}
        shell: bash
        run: eval "$CMD"

      - name: build
        if: inputs.build-cmd != ''
        env:
          CMD: ${{ inputs.build-cmd }}
        shell: bash
        run: eval "$CMD"
