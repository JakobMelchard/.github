name: go

# Reusable Go CI: vet, test, build. Skips ci for Markdown-only changes.
#
#   jobs:
#     ci:
#       uses: JakobMelchard/.github/.github/workflows/go.yml@vX.Y.Z
#       with: { test-cmd: make test }

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      go-version:
        description: Go toolchain version for actions/setup-go.
        type: string
        default: "1.25"
      working-directory:
        description: Module root. Every run step executes there; go.sum caching is keyed on it and off when absent.
        type: string
        default: "."
      vet-cmd:
        description: Runs first. Empty skips the step.
        type: string
        default: "go vet ./..."
      test-cmd:
        description: Runs second. Empty skips the step.
        type: string
        default: "go test ./..."
      build-cmd:
        description: Runs last. Empty skips the step.
        type: string
        default: "go build ./..."
      runs-on:
        description: >
          Runner label for the ci job only (pr-title and changes always use RUNNER_LINUX).
          Empty picks the org variable RUNNER_LINUX (self-hosted on mimi, visible to
          private repos only) and falls back to Blacksmith (ubuntu-latest outside JakobMelchard).
        type: string
        default: ""
      private-modules:
        description: >
          Set GOPRIVATE to the owner's repos and wire a token into git so private modules
          resolve. The token is the minted app token, else github.token.
        type: boolean
        default: false
      private-repos:
        description: >
          Comma or newline separated repos the minted app token may read, e.g. "gsheet".
          Only used with app credentials.
        type: string
        default: ""
    secrets:
      app-client-id:
        description: GitHub App client ID. Only read when private-modules is true.
        required: false
      app-private-key:
        description: GitHub App private key. Its presence selects the app path.
        required: false

jobs:
  # The title becomes the squash commit that release-please reads; same regex as .githooks/commit-msg.
  pr-title:
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    runs-on: ${{ fromJSON(vars.RUNNER_LINUX || (github.repository_owner == 'JakobMelchard' && '"blacksmith-2vcpu-ubuntu-2404"' || '"ubuntu-latest"')) }}
    steps:
      - name: conventional title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        shell: bash
        run: |
          types='feat|fix|chore|docs|refactor|test|ci|build|perf|style|revert'
          if printf '%s\n' "$TITLE" | grep -Eq "^($types)(\([A-Za-z0-9._/-]+\))?!?: .+"; then
            echo "ok: $TITLE"
          else
            echo "::error title=PR title::'$TITLE' is not a conventional commit: <type>(<scope>)!: <subject>, type one of $types"
            exit 1
          fi

  changes:
    timeout-minutes: 10
    runs-on: ${{ fromJSON(vars.RUNNER_LINUX || (github.repository_owner == 'JakobMelchard' && '"blacksmith-2vcpu-ubuntu-2404"' || '"ubuntu-latest"')) }}
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      - id: files
        uses: JakobMelchard/.github/actions/code-changed@main

  ci:
    timeout-minutes: 60
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ inputs.runs-on || fromJSON(vars.RUNNER_LINUX || (github.repository_owner == 'JakobMelchard' && '"blacksmith-2vcpu-ubuntu-2404"' || '"ubuntu-latest"')) }}
    env:
      # `secrets` is unavailable in a step-level `if`; expose only the boolean, never the key.
      HAS_APP: ${{ secrets.app-private-key != '' }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }

      - name: provenance
        # job.workflow_ref and job.workflow_sha are read through toJSON: actionlint's job context lacks them.
        env:
          JOB: ${{ toJSON(job) }}
        shell: bash
        run: |
          ref=$(jq -r '.workflow_ref // "unknown"' <<<"$JOB")
          sha=$(jq -r '.workflow_sha // "unknown"' <<<"$JOB")
          echo "reusable workflow: $ref @ $sha"
          echo "Reusable workflow: \`$ref\` @ \`$sha\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go-version }}
          # A repo without go.sum at that path makes setup-go fail on an
          # unresolvable cache path: turn caching off in that case.
          cache: ${{ hashFiles(format('{0}/go.sum', inputs.working-directory)) != '' }}
          cache-dependency-path: ${{ inputs.working-directory }}/go.sum

      - name: mint app token
        id: app
        if: inputs.private-modules && env.HAS_APP == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.app-client-id }}
          private-key: ${{ secrets.app-private-key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ inputs.private-repos }}
          permission-contents: read

      # GOPRIVATE alone is not enough on a runner: git needs credentials too.
      - name: configure private module access
        if: inputs.private-modules
        env:
          TOKEN: ${{ steps.app.outputs.token || github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          go env -w GOPRIVATE="github.com/$OWNER/*"
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: vet
        if: inputs.vet-cmd != ''
        env:
          CMD: ${{ inputs.vet-cmd }}
        shell: bash
        run: eval "$CMD"

      - name: test
        if: inputs.test-cmd != ''
        env:
          CMD: ${{ inputs.test-cmd }}
        shell: bash
        run: eval "$CMD"

      - name: build
        if: inputs.build-cmd != ''
        env:
          CMD: ${{ inputs.build-cmd }}
        shell: bash
        run: eval "$CMD"
