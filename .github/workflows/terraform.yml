name: terraform

# Reusable OpenTofu lint: fmt, init without a backend, validate. Plans and applies are tofu.yml.
#
#   jobs:
#     ci:
#       uses: JakobMelchard/.github/.github/workflows/terraform.yml@vX.Y.Z
#       with: { working-directory: terraform/cloudflare }

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      working-directory:
        description: OpenTofu root.
        type: string
        default: terraform
      validate:
        description: Run `tofu validate`. Set false only for a config known not to validate yet, and say why at the call site.
        type: boolean
        default: true
      runs-on:
        description: >
          Empty picks the org variable RUNNER_LINUX (self-hosted, visible to
          private repos only) and falls back to ubuntu-latest.
        type: string
        default: ""
      fold:
        description: >
          Run the title check as the first step of ci and skip the pr-title and changes jobs: one VM
          boot instead of three. ci then also runs for Markdown-only changes. Require the ci check, not
          only pr-title, in branch protection: a failing title fails ci, and the skipped pr-title passes.
        type: boolean
        default: false

jobs:
  # The title becomes the squash commit that release-please reads; same regex as the .githooks conventional-commit hook.
  pr-title:
    if: ${{ github.event_name == 'pull_request' && !inputs.fold }}
    runs-on: ${{ fromJSON(vars.RUNNER_LINUX || '"ubuntu-latest"') }}
    concurrency:
      group: terraform-pr-title-${{ inputs.working-directory }}-${{ inputs.fold }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: JakobMelchard/.github/actions/scripts@131a9a7cd081fa4bc30044fa2c661ad11c988e60 # v2.8.0
      - name: conventional title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: jm-pr-title

  changes:
    if: ${{ !inputs.fold }}
    runs-on: ${{ fromJSON(vars.RUNNER_LINUX || '"ubuntu-latest"') }}
    concurrency:
      group: terraform-changes-${{ inputs.working-directory }}-${{ inputs.fold }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      - id: files
        uses: JakobMelchard/.github/actions/code-changed@131a9a7cd081fa4bc30044fa2c661ad11c988e60 # v2.8.0

  ci:
    needs: changes
    if: ${{ !cancelled() && (inputs.fold || needs.changes.outputs.code == 'true') }}
    runs-on: ${{ inputs.runs-on || fromJSON(vars.RUNNER_LINUX || '"ubuntu-latest"') }}
    concurrency:
      group: terraform-ci-${{ inputs.working-directory }}-${{ inputs.fold }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - if: ${{ inputs.fold && github.event_name == 'pull_request' }}
        uses: JakobMelchard/.github/actions/scripts@131a9a7cd081fa4bc30044fa2c661ad11c988e60 # v2.8.0
      - name: conventional title
        if: ${{ inputs.fold && github.event_name == 'pull_request' }}
        working-directory: ${{ github.workspace }}
        shell: bash
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: jm-pr-title

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }

      - name: provenance
        # job.workflow_ref and job.workflow_sha are read through toJSON: actionlint's job context lacks them.
        env:
          JOB: ${{ toJSON(job) }}
        shell: bash
        run: |
          ref=$(jq -r '.workflow_ref // "unknown"' <<<"$JOB")
          sha=$(jq -r '.workflow_sha // "unknown"' <<<"$JOB")
          echo "reusable workflow: $ref @ $sha"
          echo "Reusable workflow: \`$ref\` @ \`$sha\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with: { tofu_wrapper: false }

      - run: tofu fmt -check -recursive
      - run: tofu init -backend=false
      - if: inputs.validate
        run: tofu validate
