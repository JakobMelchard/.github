name: tofu

# Reusable OpenTofu plan, apply and encrypted state commit, separate from terraform.yml (lint
# only) so lint-only callers never grant its permissions. Plan comments on PRs, apply runs on a
# push to the default branch, then the state is committed. The caller owns the triggers (filter
# push on the root's paths, exclude the state directory) and grants id-token: write and
# pull-requests: write.
#
#   jobs:
#     tofu:
#       uses: JakobMelchard/.github/.github/workflows/tofu.yml@vX.Y.Z
#       with: { working-directory: terraform/tailscale }

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      working-directory:
        description: OpenTofu root.
        type: string
        default: terraform
      runs-on:
        description: >
          Empty picks the org variable RUNNER_LINUX (self-hosted on mimi, visible to
          private repos only) and falls back to Blacksmith (ubuntu-latest for public repos and outside JakobMelchard).
        type: string
        default: ""
      plan:
        description: >
          On pull requests and manual runs, `tofu init` and `tofu plan` against the committed
          state, posted as one PR comment per working directory. Skipped, reporting success,
          when a PR does not touch working-directory, so a required check never hangs. The PR's
          tofu code runs with the state passphrase and the minted app tokens in its environment,
          and through the job's id-token it can log in to Infisical as gha-org and read every gha
          secret, the app key included. Only trusted authors may push branches.
        type: boolean
        default: true
      apply:
        description: Run `tofu apply -auto-approve` on a push to the default branch.
        type: boolean
        default: true
      state-commit:
        description: >
          After the apply, push the updated encrypted state to the default branch as the org
          app, only when the state serial moved; a plaintext state is refused. The app needs an
          `always` bypass on the branch ruleset. The commit message carries the skip-ci marker.
        type: boolean
        default: true
      state-path:
        description: State file relative to working-directory.
        type: string
        default: state/terraform.tfstate
      passphrase-env:
        description: Env var that receives TOFU_STATE_PASSPHRASE from Infisical.
        type: string
        default: TF_VAR_state_passphrase
      env:
        description: Extra non-secret env for plan and apply, one KEY=VALUE per line.
        type: string
        default: ""
      extra-infisical-project:
        description: >
          Slug of a second Infisical project (env dev, root path) loaded after gha in the plan
          and apply jobs, e.g. cloudflare-a1s-e. Empty loads none. A secret there that collides
          with TOFU_STATE_PASSPHRASE or APP_* from gha fails the job.
        type: string
        default: ""
      extra-infisical-identity:
        description: >
          Identity id for the OIDC login to extra-infisical-project. It must trust the caller's
          OIDC subject: repo:OWNER/REPO:pull_request for PR runs, repo:OWNER/REPO:ref:refs/heads/BRANCH
          for push and workflow_dispatch runs.
        type: string
        default: ""
      env-map:
        description: >
          TARGET=SOURCE per line, blank lines allowed. After both projects are loaded, TARGET is
          set to the value of env var SOURCE (masked); an empty SOURCE fails the job. The second
          project also exports every secret it holds under its own name. PR plans run the PR's
          tofu code with these secrets in the environment: use it only where PR authors are
          trusted (fork PRs get no id-token, so no login).
        type: string
        default: ""
      app-token-owner:
        description: Account to mint an org-app installation token for, exported as app-token-env. Empty mints none.
        type: string
        default: ""
      app-token-env:
        description: Env var that receives the app-token-owner token.
        type: string
        default: GITHUB_TOKEN
      app-token-owner-2:
        description: Second account to mint an installation token for, e.g. a provider alias on another account. Empty mints none.
        type: string
        default: ""
      app-token-env-2:
        description: Env var that receives the app-token-owner-2 token. Required when app-token-owner-2 is set.
        type: string
        default: ""

jobs:
  # Plan against the committed state. The check always reports, so a required `plan`
  # status never hangs on a PR that does not touch this root.
  plan:
    if: inputs.plan && github.event_name != 'push'
    runs-on: ${{ inputs.runs-on || fromJSON(vars.RUNNER_LINUX || (github.repository_owner == 'JakobMelchard' && toJSON(github.event.repository.private) != 'false' && '"blacksmith-2vcpu-ubuntu-2404"' || '"ubuntu-latest"')) }}
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    # Not the apply group: a group keeps one pending job, so a queued plan would cancel a queued
    # apply. Plans only read the committed state.
    concurrency:
      group: tofu-plan-${{ inputs.working-directory }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: false
    env:
      TF_IN_AUTOMATION: "1"
      TF_INPUT: "0"
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }

      - uses: JakobMelchard/.github/actions/scripts@bb2bfba924426cf38e2eb1dabc4214f8ebf66c49 # v2.3.0

      - name: changed files
        id: changed
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          DIR: ${{ inputs.working-directory }}
        run: jm-tofu-changed

      - if: steps.changed.outputs.run != 'false'
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with: { tofu_wrapper: false }

      - name: fetch TOFU_STATE_PASSPHRASE
        if: steps.changed.outputs.run != 'false'
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: b1ede60d-f7a7-4699-86ec-eea6ac51be30 # gha-org
          domain: https://eu.infisical.com
          project-slug: gha-lfq-y
          env-slug: dev
          secret-name: TOFU_STATE_PASSPHRASE

      - name: fetch APP_CLIENT_ID
        if: steps.changed.outputs.run != 'false' && (inputs.app-token-owner != '' || inputs.app-token-owner-2 != '')
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: b1ede60d-f7a7-4699-86ec-eea6ac51be30 # gha-org
          domain: https://eu.infisical.com
          project-slug: gha-lfq-y
          env-slug: dev
          secret-name: APP_CLIENT_ID

      - name: fetch APP_PRIVATE_KEY
        if: steps.changed.outputs.run != 'false' && (inputs.app-token-owner != '' || inputs.app-token-owner-2 != '')
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: b1ede60d-f7a7-4699-86ec-eea6ac51be30 # gha-org
          domain: https://eu.infisical.com
          project-slug: gha-lfq-y
          env-slug: dev
          secret-name: APP_PRIVATE_KEY

      - name: snapshot gha credentials
        if: steps.changed.outputs.run != 'false' && inputs.extra-infisical-project != ''
        run: |
          echo "GHA_GUARD=$(printf '%s|%s|%s' "$TOFU_STATE_PASSPHRASE" "$APP_CLIENT_ID" "$APP_PRIVATE_KEY" | sha256sum | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: extra secrets
        if: steps.changed.outputs.run != 'false' && inputs.extra-infisical-project != ''
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: ${{ inputs.extra-infisical-identity }}
          domain: https://eu.infisical.com
          project-slug: ${{ inputs.extra-infisical-project }}
          env-slug: dev

      - name: guard gha credentials
        if: steps.changed.outputs.run != 'false' && inputs.extra-infisical-project != ''
        run: |
          now=$(printf '%s|%s|%s' "$TOFU_STATE_PASSPHRASE" "$APP_CLIENT_ID" "$APP_PRIVATE_KEY" | sha256sum | cut -d' ' -f1)
          [ "$now" = "$GHA_GUARD" ] || { echo "::error::the extra Infisical project overrides TOFU_STATE_PASSPHRASE, APP_CLIENT_ID or APP_PRIVATE_KEY"; exit 1; }

      - name: env map
        if: steps.changed.outputs.run != 'false' && inputs.env-map != ''
        env:
          MAP: ${{ inputs.env-map }}
        run: jm-tofu-env-map

      - name: tofu env
        if: steps.changed.outputs.run != 'false'
        env:
          PASSPHRASE: ${{ env.TOFU_STATE_PASSPHRASE }}
          PASSPHRASE_VAR: ${{ inputs.passphrase-env }}
          EXTRA: ${{ inputs.env }}
        run: jm-tofu-env

      # Unscoped on purpose: create-github-app-token has no `permission-*` input for
      # Variables (infra github root), and naming any permission drops the rest. The
      # installation itself is scoped to what the root needs.
      - name: mint app token
        id: app
        if: steps.changed.outputs.run != 'false' && inputs.app-token-owner != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0 # zizmor: ignore[github-app]
        with:
          client-id: ${{ env.APP_CLIENT_ID }}
          private-key: ${{ env.APP_PRIVATE_KEY }}
          owner: ${{ inputs.app-token-owner }}

      - name: mint app token (2)
        id: app2
        if: steps.changed.outputs.run != 'false' && inputs.app-token-owner-2 != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0 # zizmor: ignore[github-app]
        with:
          client-id: ${{ env.APP_CLIENT_ID }}
          private-key: ${{ env.APP_PRIVATE_KEY }}
          owner: ${{ inputs.app-token-owner-2 }}

      - name: export app tokens
        if: steps.changed.outputs.run != 'false' && (inputs.app-token-owner != '' || inputs.app-token-owner-2 != '')
        env:
          TOKEN: ${{ steps.app.outputs.token }}
          TOKEN_VAR: ${{ inputs.app-token-env }}
          TOKEN2: ${{ steps.app2.outputs.token }}
          TOKEN2_VAR: ${{ inputs.app-token-env-2 }}
        run: jm-tofu-tokens

      # Keeps the app key out of the env of the PR's tofu code. It does not stop that code from
      # reading the key through the job's id-token.
      - name: drop the app key from the job env
        if: steps.changed.outputs.run != 'false' && (inputs.app-token-owner != '' || inputs.app-token-owner-2 != '')
        run: echo "APP_PRIVATE_KEY=" >> "$GITHUB_ENV"

      - if: steps.changed.outputs.run != 'false'
        run: tofu init -input=false

      - name: tofu plan
        id: plan
        if: steps.changed.outputs.run != 'false'
        run: |
          set -o pipefail
          tofu plan -no-color -out=plan.tfplan 2>&1 | tee plan.txt

      - name: comment
        if: always() && github.event_name == 'pull_request' && steps.changed.outputs.run != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          OUTCOME: ${{ steps.plan.outcome }}
          DIR: ${{ inputs.working-directory }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: jm-tofu-comment

  apply:
    if: >-
      inputs.apply && github.event_name == 'push'
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ${{ inputs.runs-on || fromJSON(vars.RUNNER_LINUX || (github.repository_owner == 'JakobMelchard' && toJSON(github.event.repository.private) != 'false' && '"blacksmith-2vcpu-ubuntu-2404"' || '"ubuntu-latest"')) }}
    permissions:
      contents: read # the state commit is pushed with the app token, not github.token
      id-token: write
    concurrency:
      group: tofu-state-${{ inputs.working-directory }}
      cancel-in-progress: false
    env:
      TF_IN_AUTOMATION: "1"
      TF_INPUT: "0"
      STATE: ${{ inputs.state-path }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
        shell: bash
    steps:
      # The branch head, not github.sha: a run queued behind another apply
      # must see the state commit that run pushed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - uses: JakobMelchard/.github/actions/scripts@bb2bfba924426cf38e2eb1dabc4214f8ebf66c49 # v2.3.0

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with: { tofu_wrapper: false }

      - name: fetch TOFU_STATE_PASSPHRASE
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: b1ede60d-f7a7-4699-86ec-eea6ac51be30 # gha-org
          domain: https://eu.infisical.com
          project-slug: gha-lfq-y
          env-slug: dev
          secret-name: TOFU_STATE_PASSPHRASE

      - name: fetch APP_CLIENT_ID
        if: inputs.app-token-owner != '' || inputs.app-token-owner-2 != '' || inputs.state-commit
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: b1ede60d-f7a7-4699-86ec-eea6ac51be30 # gha-org
          domain: https://eu.infisical.com
          project-slug: gha-lfq-y
          env-slug: dev
          secret-name: APP_CLIENT_ID

      - name: fetch APP_PRIVATE_KEY
        if: inputs.app-token-owner != '' || inputs.app-token-owner-2 != ''
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: b1ede60d-f7a7-4699-86ec-eea6ac51be30 # gha-org
          domain: https://eu.infisical.com
          project-slug: gha-lfq-y
          env-slug: dev
          secret-name: APP_PRIVATE_KEY

      - name: snapshot gha credentials
        if: inputs.extra-infisical-project != ''
        run: |
          echo "GHA_GUARD=$(printf '%s|%s|%s' "$TOFU_STATE_PASSPHRASE" "$APP_CLIENT_ID" "$APP_PRIVATE_KEY" | sha256sum | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: extra secrets
        if: inputs.extra-infisical-project != ''
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: ${{ inputs.extra-infisical-identity }}
          domain: https://eu.infisical.com
          project-slug: ${{ inputs.extra-infisical-project }}
          env-slug: dev

      - name: guard gha credentials
        if: inputs.extra-infisical-project != ''
        run: |
          now=$(printf '%s|%s|%s' "$TOFU_STATE_PASSPHRASE" "$APP_CLIENT_ID" "$APP_PRIVATE_KEY" | sha256sum | cut -d' ' -f1)
          [ "$now" = "$GHA_GUARD" ] || { echo "::error::the extra Infisical project overrides TOFU_STATE_PASSPHRASE, APP_CLIENT_ID or APP_PRIVATE_KEY"; exit 1; }

      - name: env map
        if: inputs.env-map != ''
        env:
          MAP: ${{ inputs.env-map }}
        run: jm-tofu-env-map

      - name: tofu env
        env:
          PASSPHRASE: ${{ env.TOFU_STATE_PASSPHRASE }}
          PASSPHRASE_VAR: ${{ inputs.passphrase-env }}
          EXTRA: ${{ inputs.env }}
        run: jm-tofu-env

      # Unscoped on purpose: create-github-app-token has no `permission-*` input for
      # Variables (infra github root), and naming any permission drops the rest. The
      # installation itself is scoped to what the root needs.
      - name: mint app token
        id: app
        if: inputs.app-token-owner != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0 # zizmor: ignore[github-app]
        with:
          client-id: ${{ env.APP_CLIENT_ID }}
          private-key: ${{ env.APP_PRIVATE_KEY }}
          owner: ${{ inputs.app-token-owner }}

      - name: mint app token (2)
        id: app2
        if: inputs.app-token-owner-2 != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0 # zizmor: ignore[github-app]
        with:
          client-id: ${{ env.APP_CLIENT_ID }}
          private-key: ${{ env.APP_PRIVATE_KEY }}
          owner: ${{ inputs.app-token-owner-2 }}

      - name: export app tokens
        if: inputs.app-token-owner != '' || inputs.app-token-owner-2 != ''
        env:
          TOKEN: ${{ steps.app.outputs.token }}
          TOKEN_VAR: ${{ inputs.app-token-env }}
          TOKEN2: ${{ steps.app2.outputs.token }}
          TOKEN2_VAR: ${{ inputs.app-token-env-2 }}
        run: jm-tofu-tokens

      # Keeps the app key out of the env of tofu and its providers, which can still read it
      # through the job's id-token. The state commit fetches it again after the apply.
      - name: drop the app key from the job env
        if: inputs.app-token-owner != '' || inputs.app-token-owner-2 != ''
        run: echo "APP_PRIVATE_KEY=" >> "$GITHUB_ENV"

      - run: tofu init -input=false

      - name: tofu apply
        id: apply
        run: jm-tofu-apply
        env:
          WD: ${{ inputs.working-directory }}

      - name: fetch APP_PRIVATE_KEY for the state commit
        if: always() && inputs.state-commit && steps.apply.outcome != 'skipped'
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: b1ede60d-f7a7-4699-86ec-eea6ac51be30 # gha-org
          domain: https://eu.infisical.com
          project-slug: gha-lfq-y
          env-slug: dev
          secret-name: APP_PRIVATE_KEY

      # Scoped to this repo and contents: the app has an `always` bypass on the ruleset.
      - name: mint state token
        id: state
        if: always() && inputs.state-commit && steps.apply.outcome != 'skipped'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ env.APP_CLIENT_ID }}
          private-key: ${{ env.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      # Every apply re-encrypts the file (new nonce), so compare the serial,
      # which only moves on a real state change. Runs even if the apply failed
      # part-way: whatever it wrote to state must not be lost.
      - name: commit state
        if: always() && inputs.state-commit && steps.apply.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
          TOKEN: ${{ steps.state.outputs.token }}
          APP: ${{ steps.state.outputs.app-slug }}
          DIR: ${{ inputs.working-directory }}
        run: jm-tofu-state-commit
