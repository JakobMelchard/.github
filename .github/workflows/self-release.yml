name: self-release

# release-please for this repo (release.yml called locally; the org app authors the release PR so
# lint.yml runs on it), then moves the major tag onto the new release. vX.Y.Z releases are
# immutable; the major tag is a plain tag, not a release, so it may move.

permissions: {}

on:
  push:
    branches: [main]

jobs:
  release:
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    uses: ./.github/workflows/release.yml

  major-tag:
    needs: release
    if: needs.release.outputs.release_created == 'true'
    runs-on: ${{ fromJSON(vars.RUNNER_LINUX || '"ubuntu-latest"') }}
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.release.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: move major tag
        run: scripts/move-major-tag
