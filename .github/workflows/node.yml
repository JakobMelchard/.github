name: node

# Reusable Node CI.
# Vanilla JS + JSDoc house style — eslint flat config, prettier, vitest.
#
# Repos with no committed lockfile must pass install-cmd: npm install.
#
#   jobs:
#     ci:
#       uses: JakobMelchard/.github/.github/workflows/node.yml@main
#       with:
#         check-cmd: npx tsc
#         test-cmd: npm test
#       secrets: inherit          # only if the repo needs private dependencies
#
# Inputs (all optional). Steps run in this order: install, browsers, check, lint, test, e2e. Every
# *-cmd runs through eval in bash and "" skips its step.
#   node-version      string,  default "22"           Node for actions/setup-node.
#   working-directory string,  default "."            Directory every run step executes in; also
#                                                      where tokens-check looks for .config/tokens.path.
#   install-cmd       string,  default "npm ci"       "" skips install (static sites with no deps).
#   check-cmd         string,  default ""             Formatting/type check, e.g. "make check",
#                                                      "npx tsc" or "npx prettier --check .".
#   lint-cmd          string,  default "npx eslint ." Lint.
#   test-cmd          string,  default ""             Unit tests.
#   e2e-cmd           string,  default ""             Runs after test-cmd, with Chromium available when
#                                                      browsers is true.
#   browsers          boolean, default false          Cache ~/.cache/ms-playwright and, on Linux runners,
#                                                      run `playwright-core install --with-deps chromium`.
#   runs-on           string,  default ""             Runner label for the ci job only (pr-title and
#                                                      changes always use RUNNER_LINUX). Empty picks the
#                                                      org variable RUNNER_LINUX (self-hosted on mimi,
#                                                      private repos only) and falls back to ubuntu-latest.
#   private-deps      boolean, default false          Wire a token into git (https, ssh and git+ forms of
#                                                      github.com) so private JakobMelchard repos
#                                                      referenced as github:owner/repo#ref resolve.
#   private-repos     string,  default ""             Comma/newline-separated repos the minted app token
#                                                      may read, e.g. "observe". Only with app secrets.
#
# Secrets (all optional, only read when private-deps is true): app-client-id and app-private-key
# (GitHub App, preferred), else token (PAT), else the job's github.token.
#
# Jobs: pr-title (pull_request only: Conventional Commits check), changes (skips ci for markdown-only
# diffs), ci. The ci job starts with the tokens-check action, a no-op unless the repo has
# .config/tokens.path.
#
# Callers: agenx, cf, chrome-extensions, hx, interviews, JakobMelchard.github.io, mealrot, switchboard,
# workline, workouts-hx, lilfeelz/lilfeelz.github.io. Inputs passed: install-cmd, check-cmd, lint-cmd,
# test-cmd, e2e-cmd, browsers.

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: "22"
      working-directory:
        type: string
        default: "."
      install-cmd:
        description: Empty string skips install (static sites with no deps).
        type: string
        default: "npm ci"
      check-cmd:
        description: Formatting check, e.g. "make check" or "npx prettier --check .".
        type: string
        default: ""
      lint-cmd:
        type: string
        default: "npx eslint ."
      test-cmd:
        type: string
        default: ""
      e2e-cmd:
        description: Runs after test-cmd, with a browser available when browsers is true.
        type: string
        default: ""
      browsers:
        description: Install and cache Playwright Chromium for e2e.
        type: boolean
        default: false
      runs-on:
        description: >
          Empty picks the org variable RUNNER_LINUX (self-hosted on mimi, visible to
          private repos only) and falls back to ubuntu-latest.
        type: string
        default: ""
      private-deps:
        description: >
          Authenticate git so private JakobMelchard repos referenced as
          dependencies (github:owner/repo#ref, git+https://…) resolve.
        type: boolean
        default: false
      private-repos:
        description: >
          Comma/newline-separated repos the minted app token may read,
          e.g. "observe". Only used with app credentials.
        type: string
        default: ""
    secrets:
      app-client-id:
        description: GitHub App client ID (preferred over a PAT — no expiry to babysit).
        required: false
      app-private-key:
        description: GitHub App private key. Presence of this selects the app path.
        required: false
      token:
        description: PAT fallback, used when no app private key is supplied.
        required: false

jobs:
  # The PR title becomes the squash-commit subject that release-please reads.
  # Same regex as .githooks/commit-msg. Skipped on push.
  pr-title:
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    runs-on: ${{ fromJSON(vars.RUNNER_LINUX || '"ubuntu-latest"') }}
    steps:
      - name: conventional title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        shell: bash
        run: |
          types='feat|fix|chore|docs|refactor|test|ci|build|perf|style|revert'
          if printf '%s\n' "$TITLE" | grep -Eq "^($types)(\([A-Za-z0-9._/-]+\))?!?: .+"; then
            echo "ok: $TITLE"
          else
            echo "::error title=PR title::'$TITLE' is not a conventional commit: <type>(<scope>)!: <subject>, type one of $types"
            exit 1
          fi

  # Markdown-only changes skip ci (actions/code-changed); pr-title and the caller's hooks job
  # still run, since they lint titles and docs.
  changes:
    timeout-minutes: 10
    runs-on: ${{ fromJSON(vars.RUNNER_LINUX || '"ubuntu-latest"') }}
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      - id: files
        uses: JakobMelchard/.github/actions/code-changed@main

  ci:
    timeout-minutes: 60
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ inputs.runs-on || fromJSON(vars.RUNNER_LINUX || '"ubuntu-latest"') }}
    env:
      # `secrets` is not available in a step-level `if`. Evaluate the
      # comparison here so only the boolean — never the key — is in env.
      HAS_APP: ${{ secrets.app-private-key != '' }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }

      # Opt-in repos (.config/tokens.path) only; a no-op everywhere else. Also in hooks.yml,
      # for callers that run node.yml without it.
      - uses: JakobMelchard/.github/actions/tokens-check@main
        with:
          working-directory: ${{ inputs.working-directory }}

      - name: provenance
        # Which commit of JakobMelchard/.github defined this job. job.workflow_ref and
        # job.workflow_sha (GitHub, Sept 2026) are read through toJSON because
        # actionlint's job-context type does not know them yet.
        env:
          JOB: ${{ toJSON(job) }}
        shell: bash
        run: |
          ref=$(jq -r '.workflow_ref // "unknown"' <<<"$JOB")
          sha=$(jq -r '.workflow_sha // "unknown"' <<<"$JOB")
          echo "reusable workflow: $ref @ $sha"
          echo "Reusable workflow: \`$ref\` @ \`$sha\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}

      - name: mint app token
        id: app
        if: inputs.private-deps && env.HAS_APP == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.app-client-id }}
          private-key: ${{ secrets.app-private-key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ inputs.private-repos }}
          permission-contents: read

      # npm expands the `github:owner/repo` shorthand to git+ssh, so the ssh
      # and scp-like forms need the token as much as https does. git cannot
      # process a `git+` scheme on its own, so mapping those too turns a hard
      # failure into a working fetch if a tool ever passes one through.
      #
      # --add on every mapping: insteadOf is multi-valued, and a plain
      # `git config` replaces the existing value rather than appending, which
      # would leave only the last form authenticated.
      - name: configure private dependency access
        if: inputs.private-deps
        env:
          TOKEN: ${{ steps.app.outputs.token || secrets.token || github.token }}
        run: |
          auth="https://x-access-token:${TOKEN}@github.com/"
          for from in \
            "https://github.com/" \
            "ssh://git@github.com/" \
            "git@github.com:" \
            "git+https://github.com/" \
            "git+ssh://git@github.com/"; do
            git config --global --add url."$auth".insteadOf "$from"
          done

      - name: install
        if: inputs.install-cmd != ''
        env:
          CMD: ${{ inputs.install-cmd }}
        shell: bash
        run: eval "$CMD"

      - name: cache browsers
        if: inputs.browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('**/package-lock.json', '**/package.json') }}

      - name: install browsers
        # --with-deps drives apt; only Linux runners have that path
        if: inputs.browsers && runner.os == 'Linux'
        run: npx playwright-core install --with-deps chromium

      - name: check
        if: inputs.check-cmd != ''
        env:
          CMD: ${{ inputs.check-cmd }}
        shell: bash
        run: eval "$CMD"

      - name: lint
        if: inputs.lint-cmd != ''
        env:
          CMD: ${{ inputs.lint-cmd }}
        shell: bash
        run: eval "$CMD"

      - name: test
        if: inputs.test-cmd != ''
        env:
          CMD: ${{ inputs.test-cmd }}
        shell: bash
        run: eval "$CMD"

      - name: e2e
        if: inputs.e2e-cmd != ''
        env:
          CMD: ${{ inputs.e2e-cmd }}
        shell: bash
        run: eval "$CMD"
