name: node

# Reusable Node CI: install, check, lint, test, e2e. Skips ci for Markdown-only changes.
# Repos without a committed lockfile must pass install-cmd: npm install.
#
#   jobs:
#     ci:
#       uses: JakobMelchard/.github/.github/workflows/node.yml@vX.Y.Z
#       with: { check-cmd: npx tsc, test-cmd: npm test }

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      node-version:
        description: Node version for actions/setup-node.
        type: string
        default: "22"
      working-directory:
        description: Directory every run step executes in.
        type: string
        default: "."
      install-cmd:
        description: Runs first. Empty skips it (static sites with no dependencies).
        type: string
        default: "npm ci"
      check-cmd:
        description: Formatting or type check, e.g. "make check", "npx tsc" or "npx prettier --check .". Empty skips the step.
        type: string
        default: ""
      lint-cmd:
        description: Empty skips the step.
        type: string
        default: "npx eslint ."
      test-cmd:
        description: Unit tests. Empty skips the step.
        type: string
        default: ""
      e2e-cmd:
        description: Runs after test-cmd, with Chromium available when browsers is true. Empty skips the step.
        type: string
        default: ""
      browsers:
        description: >
          Cache ~/.cache/ms-playwright and, on Linux runners, run
          `playwright-core install --with-deps chromium`.
        type: boolean
        default: false
      runs-on:
        description: >
          Runner label for the ci job only (pr-title and changes always use RUNNER_LINUX).
          Empty picks the org variable RUNNER_LINUX (self-hosted on mimi, visible to
          private repos only) and falls back to Blacksmith (ubuntu-latest for public repos and outside JakobMelchard).
        type: string
        default: ""
      private-deps:
        description: >
          Wire a token into git (the https, ssh and git+ forms of github.com) so private
          JakobMelchard repos referenced as github:owner/repo#ref resolve. The token is the
          minted app token, else github.token.
        type: boolean
        default: false
      private-repos:
        description: >
          Comma or newline separated repos the minted app token may read, e.g. "observe".
          Only used with app credentials.
        type: string
        default: ""
    secrets:
      app-client-id:
        description: GitHub App client ID. Only read when private-deps is true.
        required: false
      app-private-key:
        description: GitHub App private key. Its presence selects the app path.
        required: false

jobs:
  # The title becomes the squash commit that release-please reads; same regex as the .githooks conventional-commit hook.
  pr-title:
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    runs-on: ${{ fromJSON(vars.RUNNER_LINUX || (github.repository_owner == 'JakobMelchard' && toJSON(github.event.repository.private) != 'false' && '"blacksmith-2vcpu-ubuntu-2404"' || '"ubuntu-latest"')) }}
    steps:
      - name: conventional title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        shell: bash
        run: |
          types='feat|fix|chore|docs|refactor|test|ci|build|perf|style|revert'
          if printf '%s\n' "$TITLE" | grep -Eq "^($types)(\([A-Za-z0-9._/-]+\))?!?: .+"; then
            echo "ok: $TITLE"
          else
            echo "::error title=PR title::'$TITLE' is not a conventional commit: <type>(<scope>)!: <subject>, type one of $types"
            exit 1
          fi

  changes:
    timeout-minutes: 10
    runs-on: ${{ fromJSON(vars.RUNNER_LINUX || (github.repository_owner == 'JakobMelchard' && toJSON(github.event.repository.private) != 'false' && '"blacksmith-2vcpu-ubuntu-2404"' || '"ubuntu-latest"')) }}
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      - id: files
        uses: JakobMelchard/.github/actions/code-changed@86ce618fe2528abf23b57f57de9d012f04041b2d # v2.0.1

  ci:
    timeout-minutes: 60
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ inputs.runs-on || fromJSON(vars.RUNNER_LINUX || (github.repository_owner == 'JakobMelchard' && toJSON(github.event.repository.private) != 'false' && '"blacksmith-2vcpu-ubuntu-2404"' || '"ubuntu-latest"')) }}
    env:
      # `secrets` is unavailable in a step-level `if`; expose only the boolean, never the key.
      HAS_APP: ${{ secrets.app-private-key != '' }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }

      - name: provenance
        # job.workflow_ref and job.workflow_sha are read through toJSON: actionlint's job context lacks them.
        env:
          JOB: ${{ toJSON(job) }}
        shell: bash
        run: |
          ref=$(jq -r '.workflow_ref // "unknown"' <<<"$JOB")
          sha=$(jq -r '.workflow_sha // "unknown"' <<<"$JOB")
          echo "reusable workflow: $ref @ $sha"
          echo "Reusable workflow: \`$ref\` @ \`$sha\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}

      - name: mint app token
        id: app
        if: inputs.private-deps && env.HAS_APP == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.app-client-id }}
          private-key: ${{ secrets.app-private-key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ inputs.private-repos }}
          permission-contents: read

      # npm expands `github:owner/repo` to git+ssh, so every form needs the token. GIT_CONFIG_*
      # in the job env, not ~/.gitconfig: a persistent runner would keep the token for later jobs.
      - name: configure private dependency access
        if: inputs.private-deps
        env:
          TOKEN: ${{ steps.app.outputs.token || github.token }}
        run: |
          auth="https://x-access-token:${TOKEN}@github.com/"
          i=0
          for from in \
            "https://github.com/" \
            "ssh://git@github.com/" \
            "git@github.com:" \
            "git+https://github.com/" \
            "git+ssh://git@github.com/"; do
            printf 'GIT_CONFIG_KEY_%s=url.%s.insteadOf\nGIT_CONFIG_VALUE_%s=%s\n' "$i" "$auth" "$i" "$from" >> "$GITHUB_ENV"
            i=$((i + 1))
          done
          echo "GIT_CONFIG_COUNT=$i" >> "$GITHUB_ENV"

      - name: install
        if: inputs.install-cmd != ''
        env:
          CMD: ${{ inputs.install-cmd }}
        shell: bash
        run: eval "$CMD"

      - name: cache browsers
        if: inputs.browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('**/package-lock.json', '**/package.json') }}

      - name: install browsers
        # --with-deps drives apt, which only Linux runners have
        if: inputs.browsers && runner.os == 'Linux'
        run: npx playwright-core install --with-deps chromium

      - name: check
        if: inputs.check-cmd != ''
        env:
          CMD: ${{ inputs.check-cmd }}
        shell: bash
        run: eval "$CMD"

      - name: lint
        if: inputs.lint-cmd != ''
        env:
          CMD: ${{ inputs.lint-cmd }}
        shell: bash
        run: eval "$CMD"

      - name: test
        if: inputs.test-cmd != ''
        env:
          CMD: ${{ inputs.test-cmd }}
        shell: bash
        run: eval "$CMD"

      - name: e2e
        if: inputs.e2e-cmd != ''
        env:
          CMD: ${{ inputs.e2e-cmd }}
        shell: bash
        run: eval "$CMD"
