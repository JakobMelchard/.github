name: node

# Reusable Node CI. Callers: cf, transcriber, lilfeelz.github.io, lyrics, lift, hx.
# Vanilla JS + JSDoc house style — eslint flat config, prettier, vitest.

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: "22"
      working-directory:
        type: string
        default: "."
      install-cmd:
        description: Empty string skips install (static sites with no deps).
        type: string
        default: "npm ci"
      check-cmd:
        description: Formatting check, e.g. "make check" or "npx prettier --check .".
        type: string
        default: ""
      lint-cmd:
        type: string
        default: "npx eslint ."
      test-cmd:
        type: string
        default: ""
      e2e-cmd:
        description: Browser end-to-end step, e.g. "npm run e2e". Empty skips.
        type: string
        default: ""
      browsers:
        description: Install Playwright Chromium (with system deps) before e2e.
        type: boolean
        default: false
      runs-on:
        type: string
        default: ubuntu-latest

jobs:
  ci:
    runs-on: ${{ inputs.runs-on }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}

      - name: install
        if: inputs.install-cmd != ''
        env:
          CMD: ${{ inputs.install-cmd }}
        shell: bash
        run: eval "$CMD"

      - name: check
        if: inputs.check-cmd != ''
        env:
          CMD: ${{ inputs.check-cmd }}
        shell: bash
        run: eval "$CMD"

      - name: lint
        if: inputs.lint-cmd != ''
        env:
          CMD: ${{ inputs.lint-cmd }}
        shell: bash
        run: eval "$CMD"

      - name: test
        if: inputs.test-cmd != ''
        env:
          CMD: ${{ inputs.test-cmd }}
        shell: bash
        run: eval "$CMD"

      - name: install chromium
        # --with-deps drives apt; only Linux runners have that path
        if: inputs.browsers && inputs.e2e-cmd != '' && runner.os == 'Linux'
        run: npx --yes playwright-core install --with-deps chromium

      - name: e2e
        if: inputs.e2e-cmd != ''
        env:
          CMD: ${{ inputs.e2e-cmd }}
        shell: bash
        run: eval "$CMD"
