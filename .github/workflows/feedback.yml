name: feedback

# Reusable feedback triage. Callers: flatplan.
# An issue labeled `feedback` (filed by switchboard from observe's shim) is read by
# opencode's read-only agent (actions/feedback-triage): new title, kind label, summary
# comment, `agent:ready` when scoped. The caller passes the OpenCode key as a secret.

permissions:
  contents: read
  issues: write

on:
  workflow_call:
    inputs:
      issue:
        description: Issue number to triage.
        type: number
        required: true
      model:
        description: opencode model, provider/model.
        type: string
        default: opencode-go/mimo-v2.5
    secrets:
      OPENCODE_API_KEY:
        description: OpenCode (Zen or Go) API key.
        required: true

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }

      - uses: JakobMelchard/.github/actions/feedback-triage@main
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          issue: ${{ inputs.issue }}
          model: ${{ inputs.model }}
