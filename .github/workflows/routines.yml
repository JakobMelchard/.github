name: routines

# Nightly routines: runs routines/*.md with opencode on the org app token over
# the non-archived org repos the app can reach. Nothing runs unless the repo variable ROUTINES is
# "on"; workflow_dispatch defaults to a dry run. The app token cannot reach lilfeelz/*, which the
# prompts treat as "repository folder missing".
# Secrets (APP_*, OPENCODE_API_KEY_ROUTINES) come from Infisical project gha, one secret at a time, and the
# app key is blanked from the env once the token is minted.
# A dry run mints a read-only token. The app needs Contents, Issues and Pull requests write plus
# Checks and Actions read.
#
# Keep ROUTINES unset until the agent runs without OIDC and without the ruleset-bypass app: with
# id-token: write in the job, the agent or any repo script can log in to Infisical as gha-org and
# read every gha secret, and the minted token can push to any org repo.

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      routine:
        description: Which prompt to run.
        type: choice
        options: [nightly-sweep, nightly-improve]
        default: nightly-sweep
      dry_run:
        description: Read-only; print the plan, change nothing on GitHub.
        type: boolean
        default: true
      model:
        description: opencode model as provider/model.
        type: string
        default: opencode/deepseek-v4.1-flash-free
  schedule:
    - cron: "7 1 * * *" # nightly-sweep, 03:07 Vienna in summer time
    - cron: "37 2 * * *" # nightly-improve, 04:37 Vienna in summer time

jobs:
  run:
    if: vars.ROUTINES == 'on'
    runs-on: ${{ fromJSON(vars.RUNNER_LINUX || '"ubuntu-latest"') }}
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: routines
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }

      - name: pick the routine
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          INPUT: ${{ inputs.routine }}
          CRON: ${{ github.event.schedule }}
        run: scripts/routine pick

      - name: fetch APP_CLIENT_ID
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: b1ede60d-f7a7-4699-86ec-eea6ac51be30 # gha-org
          domain: https://eu.infisical.com
          project-slug: gha-lfq-y
          env-slug: dev
          secret-name: APP_CLIENT_ID

      - name: fetch APP_PRIVATE_KEY
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: b1ede60d-f7a7-4699-86ec-eea6ac51be30 # gha-org
          domain: https://eu.infisical.com
          project-slug: gha-lfq-y
          env-slug: dev
          secret-name: APP_PRIVATE_KEY

      - name: mint app token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0 # zizmor: ignore[github-app] the repo set is listed with this token, so it cannot be scoped up front
        with:
          client-id: ${{ env.APP_CLIENT_ID }}
          private-key: ${{ env.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: ${{ inputs.dry_run && 'read' || 'write' }}
          permission-issues: ${{ inputs.dry_run && 'read' || 'write' }}
          permission-pull-requests: ${{ inputs.dry_run && 'read' || 'write' }}
          permission-checks: read
          permission-actions: read

      - name: drop the app key from the job env
        run: echo "APP_PRIVATE_KEY=" >> "$GITHUB_ENV"

      - name: clone the repos in scope
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          OWNER: ${{ github.repository_owner }}
        run: scripts/routine clone

      - name: install opencode
        run: npm install -g opencode-ai@1.18.33 --no-audit --no-fund # zizmor: ignore[adhoc-packages] exact version, no lockfile for a global CLI

      - name: fetch OPENCODE_API_KEY_ROUTINES
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: b1ede60d-f7a7-4699-86ec-eea6ac51be30 # gha-org
          domain: https://eu.infisical.com
          project-slug: gha-lfq-y
          env-slug: dev
          secret-name: OPENCODE_API_KEY_ROUTINES

      - name: run the routine
        working-directory: work
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          OPENCODE_API_KEY: ${{ env.OPENCODE_API_KEY_ROUTINES }}
          MODEL: ${{ inputs.model || 'opencode/deepseek-v4.1-flash-free' }}
          PROMPT: ${{ github.workspace }}/routines/${{ steps.pick.outputs.routine }}.md
          DRY: ${{ inputs.dry_run }}
        run: ../scripts/routine run
