name: release

# Shared release-please. The release PR and the release are authored by the org
# app, so `pull_request` workflows run on the release PR (github.token-created PRs
# trigger nothing). Its credentials come from Infisical (project gha, identity
# gha-org, OIDC), so the calling job must grant id-token: write. Callers that need
# to publish assets read the outputs:
#
#   jobs:
#     release:
#       uses: JakobMelchard/.github/.github/workflows/release.yml@main
#       with: { release-type: go }
#       permissions: { contents: write, pull-requests: write, id-token: write }
#     publish:
#       needs: release
#       if: needs.release.outputs.release_created == 'true'

on:
  workflow_call:
    inputs:
      release-type:
        description: release-please release type (go, node, simple, …). Empty = infer from config files.
        type: string
        default: ""
      config-file:
        type: string
        default: release-please-config.json
      manifest-file:
        type: string
        default: .release-please-manifest.json
      runs-on:
        description: >
          JSON runner spec, a quoted label or a label array, e.g. '["self-hosted","macOS"]'
          or a caller's vars.RUNNER_MACOS. Unlike the plain-label runs-on of the build
          workflows, so a macOS-only private repo can reach the mimi runner. Empty picks
          the org variable RUNNER_LINUX and falls back to ubuntu-latest.
        type: string
        default: ""
    outputs:
      release_created:
        value: ${{ jobs.release-please.outputs.release_created }}
      tag_name:
        value: ${{ jobs.release-please.outputs.tag_name }}
      version:
        value: ${{ jobs.release-please.outputs.version }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    runs-on: ${{ fromJSON(inputs.runs-on || vars.RUNNER_LINUX || '"ubuntu-latest"') }}
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: provenance
        # Which commit of JakobMelchard/.github defined this job. job.workflow_ref and
        # job.workflow_sha (GitHub, Sept 2026) are read through toJSON because
        # actionlint's job-context type does not know them yet.
        env:
          JOB: ${{ toJSON(job) }}
        shell: bash
        run: |
          ref=$(jq -r '.workflow_ref // "unknown"' <<<"$JOB")
          sha=$(jq -r '.workflow_sha // "unknown"' <<<"$JOB")
          echo "reusable workflow: $ref @ $sha"
          echo "Reusable workflow: \`$ref\` @ \`$sha\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: b1ede60d-f7a7-4699-86ec-eea6ac51be30 # gha-org
          domain: https://eu.infisical.com
          project-slug: gha-lfq-y
          env-slug: dev

      - name: mint app token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ env.APP_CLIENT_ID }}
          private-key: ${{ env.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app.outputs.token }}
          release-type: ${{ inputs.release-type }}
          config-file: ${{ inputs.config-file }}
          manifest-file: ${{ inputs.manifest-file }}
