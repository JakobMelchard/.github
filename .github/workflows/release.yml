name: release

# Shared release-please. The release PR and the release are authored by the org app, so
# pull_request workflows run on the release PR (PRs created with github.token trigger nothing).
# Credentials come from Infisical over OIDC, so the calling job must grant id-token: write or
# the run fails at startup.
#
#   jobs:
#     release:
#       uses: JakobMelchard/.github/.github/workflows/release.yml@vX.Y.Z
#       permissions: { contents: read, id-token: write }

on:
  workflow_call:
    inputs:
      release-type:
        description: release-please release type (go, node, simple, ...). Empty infers it from the config file.
        type: string
        default: ""
      config-file:
        description: release-please config path.
        type: string
        default: release-please-config.json
      manifest-file:
        description: release-please manifest path.
        type: string
        default: .release-please-manifest.json
      runs-on:
        description: >
          JSON runner spec, a quoted label or a label array, e.g. '["self-hosted","macOS"]' or a
          caller's vars.RUNNER_MACOS. Unlike the plain-label runs-on of the build workflows, so a
          macOS-only private repo can reach the self-hosted runner. Empty picks the org variable
          RUNNER_LINUX and falls back to ubuntu-latest.
        type: string
        default: ""
    outputs:
      release_created:
        description: '"true" when this run cut a release.'
        value: ${{ jobs.release-please.outputs.release_created }}
      tag_name:
        description: Tag of that release, e.g. v1.4.2.
        value: ${{ jobs.release-please.outputs.tag_name }}
      version:
        description: Version of that release, e.g. 1.4.2.
        value: ${{ jobs.release-please.outputs.version }}
      releases_created:
        description: '"true" when any component was released, including the root.'
        value: ${{ jobs.release-please.outputs.releases_created }}
      paths_released:
        description: JSON array of released canonical package paths, or [].
        value: ${{ jobs.release-please.outputs.paths_released }}
      releases:
        description: JSON object keyed by released package path, with tag_name and version per component.
        value: ${{ jobs.release-please.outputs.releases }}

permissions: {}

jobs:
  release-please:
    runs-on: ${{ fromJSON(inputs.runs-on || vars.RUNNER_LINUX || '"ubuntu-latest"') }}
    timeout-minutes: 10
    # Writes go through the app token; id-token is for Infisical.
    permissions:
      contents: read
      id-token: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      releases_created: ${{ steps.components.outputs.releases_created }}
      paths_released: ${{ steps.components.outputs.paths_released }}
      releases: ${{ steps.components.outputs.releases }}
    steps:
      - name: provenance
        # job.workflow_ref and job.workflow_sha are read through toJSON: actionlint's job context lacks them.
        env:
          JOB: ${{ toJSON(job) }}
        shell: bash
        run: |
          ref=$(jq -r '.workflow_ref // "unknown"' <<<"$JOB")
          sha=$(jq -r '.workflow_sha // "unknown"' <<<"$JOB")
          echo "reusable workflow: $ref @ $sha"
          echo "Reusable workflow: \`$ref\` @ \`$sha\`" >> "$GITHUB_STEP_SUMMARY"

      - name: fetch APP_CLIENT_ID
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: b1ede60d-f7a7-4699-86ec-eea6ac51be30 # gha-org
          domain: https://eu.infisical.com
          project-slug: gha-lfq-y
          env-slug: dev
          secret-name: APP_CLIENT_ID

      - name: fetch APP_PRIVATE_KEY
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: b1ede60d-f7a7-4699-86ec-eea6ac51be30 # gha-org
          domain: https://eu.infisical.com
          project-slug: gha-lfq-y
          env-slug: dev
          secret-name: APP_PRIVATE_KEY

      - name: mint app token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ env.APP_CLIENT_ID }}
          private-key: ${{ env.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app.outputs.token }}
          release-type: ${{ inputs.release-type }}
          config-file: ${{ inputs.config-file }}
          manifest-file: ${{ inputs.manifest-file }}

      - uses: JakobMelchard/.github/actions/scripts@98496ea77cfca9e811173edcac681a7e538be254 # component output helper
      - name: component release outputs
        id: components
        env:
          RELEASE_OUTPUTS: ${{ toJSON(steps.release.outputs) }}
        run: jm-release-outputs
