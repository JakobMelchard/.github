name: lint

# This repo's own CI: the reusable workflows here run in every other repo,
# so a syntax error is an org-wide outage.

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }

      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color .github/workflows/*.yml workflow-templates/*.yml

  zizmor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - run: uvx zizmor==1.30.1 --no-online-audits --min-severity medium .

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with: { tofu_wrapper: false }
      - run: tofu fmt -check -recursive
        working-directory: infra
      - run: tofu init -backend=false -input=false && tofu validate
        working-directory: infra
      - run: jq -e . infra/settings.json >/dev/null

  # Integration smoke: actually call each reusable workflow with its emptiest
  # viable inputs. A previous bug — an empty `${{ inputs.install-cmd }}` left an
  # empty if-body and broke every caller — passed actionlint but died at runtime.
  smoke-python:
    uses: ./.github/workflows/python.yml
    with:
      package-manager: none
      install-cmd: ""
      lint-cmd: ""
      test-cmd: ""

  smoke-node:
    uses: ./.github/workflows/node.yml
    with:
      install-cmd: ""
      lint-cmd: ""
      check-cmd: ""
      test-cmd: ""
      # exercise the Chromium install path once here, not first in a caller
      browsers: true
      e2e-cmd: npx --yes playwright-core --version

  smoke-go:
    uses: ./.github/workflows/go.yml
    with:
      vet-cmd: ""
      test-cmd: ""
      build-cmd: ""

  smoke-shell:
    uses: ./.github/workflows/shell.yml
    with:
      paths: hooks
      severity: warning
