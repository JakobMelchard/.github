name: lint

# This repo's own CI: the reusable workflows here run in every other repo,
# so a syntax error is an org-wide outage.

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }

      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color .github/workflows/*.yml workflow-templates/*.yml

  zizmor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uvx zizmor==1.30.1 --no-online-audits --min-severity medium .

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with: { tofu_wrapper: false }
      - run: tofu fmt -check -recursive
        working-directory: infra
      - run: tofu init -backend=false -input=false && tofu validate
        working-directory: infra
      - run: jq -e . infra/settings.json >/dev/null

  # Integration smoke: actually call each reusable workflow with its emptiest
  # viable inputs. A previous bug — an empty `${{ inputs.install-cmd }}` left an
  # empty if-body and broke every caller — passed actionlint but died at runtime.
  smoke-hooks:
    uses: ./.github/workflows/hooks.yml
    with:
      # the infra job runs tofu fmt; ubuntu-latest has no tofu
      skip: tofu-fmt

  smoke-python:
    uses: ./.github/workflows/python.yml
    with:
      package-manager: none
      install-cmd: ""
      lint-cmd: ""
      test-cmd: ""

  smoke-node:
    uses: ./.github/workflows/node.yml
    with:
      install-cmd: ""
      lint-cmd: ""
      check-cmd: ""
      test-cmd: ""
      # exercise the Chromium install path once here, not first in a caller
      browsers: true
      e2e-cmd: npx --yes playwright-core --version

  smoke-go:
    uses: ./.github/workflows/go.yml
    with:
      vet-cmd: ""
      test-cmd: ""
      build-cmd: ""

  smoke-shell:
    uses: ./.github/workflows/shell.yml
    with:
      paths: infra
      severity: warning

  # macOS minutes cost 10x and every hosted macOS job bills a full minute: these two smokes alone used
  # most of the org's included minutes in the first days of October 2026. They run on the self-hosted
  # macOS runner on mimi (the org variable RUNNER_MACOS is not visible to this repo's own workflows).
  smoke-xcode:
    uses: ./.github/workflows/xcode.yml
    with:
      runs-on: '["self-hosted","macOS"]'
      scheme: ""
      generate-cmd: ""
      lint-cmd: ""

  # Exercises xcode.yml's simulator step: the runner must end up with the default iPad.
  smoke-simulator:
    uses: ./.github/workflows/xcode.yml
    with:
      runs-on: '["self-hosted","macOS"]'
      generate-cmd: ""
      lint-cmd: ""
      test-cmd: "echo 'platform=iOS Simulator,name=iPad Air 11-inch (M4)' && xcrun simctl list devices available | grep -F 'iPad Air 11-inch (M4) ('"

  # No Android project here: gradle-tasks "" runs only the JDK, SDK and Gradle setup.
  smoke-android:
    uses: ./.github/workflows/android.yml
    with:
      gradle-tasks: ""
