name: lint

# This repo's own CI. The reusable workflows run in every other repo, so a break here is org-wide.

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  actionlint:
    runs-on: ${{ fromJSON(vars.RUNNER_LINUX || (github.repository_owner == 'JakobMelchard' && toJSON(github.event.repository.private) != 'false' && '"blacksmith-2vcpu-ubuntu-2404"' || '"ubuntu-latest"')) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uvx --from actionlint-py==1.7.12.25 actionlint -color .github/workflows/*.yml workflow-templates/*.yml

  zizmor:
    runs-on: ${{ fromJSON(vars.RUNNER_LINUX || (github.repository_owner == 'JakobMelchard' && toJSON(github.event.repository.private) != 'false' && '"blacksmith-2vcpu-ubuntu-2404"' || '"ubuntu-latest"')) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uvx zizmor==1.30.1 --no-online-audits --min-severity low .

  bats:
    runs-on: ${{ fromJSON(vars.RUNNER_LINUX || (github.repository_owner == 'JakobMelchard' && toJSON(github.event.repository.private) != 'false' && '"blacksmith-2vcpu-ubuntu-2404"' || '"ubuntu-latest"')) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: bats-core/bats-core
          ref: eb7f42f8d608ac693d7a4b67474f6714ea68cfc5 # v1.14.0
          path: .bats
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24 }
      - run: npm ci --prefix actions/docs --no-audit --no-fund
      - run: .bats/bin/bats scripts/test

  # build.mjs carries JSDoc types: tsc --checkJs in strict mode, and prettier for the action's files.
  docs-check:
    runs-on: ${{ fromJSON(vars.RUNNER_LINUX || (github.repository_owner == 'JakobMelchard' && toJSON(github.event.repository.private) != 'false' && '"blacksmith-2vcpu-ubuntu-2404"' || '"ubuntu-latest"')) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24 }
      - run: npm ci --prefix actions/docs --no-audit --no-fund
      - run: npm run check --prefix actions/docs

  smoke-gitleaks:
    runs-on: ${{ fromJSON(vars.RUNNER_LINUX || (github.repository_owner == 'JakobMelchard' && toJSON(github.event.repository.private) != 'false' && '"blacksmith-2vcpu-ubuntu-2404"' || '"ubuntu-latest"')) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./actions/gitleaks

  # Builds the fixture tree through the action itself; docs.bats checks the pages.
  smoke-docs:
    runs-on: ${{ fromJSON(vars.RUNNER_LINUX || (github.repository_owner == 'JakobMelchard' && toJSON(github.event.repository.private) != 'false' && '"blacksmith-2vcpu-ubuntu-2404"' || '"ubuntu-latest"')) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./actions/docs
        with: { src: scripts/test/docs-smoke, out: site, title: smoke }
      - run: test -f site/index.html && test -f site/guide/setup.html && test -f site/doc.css

  # Puts the jm-* scripts on PATH, as the reusable workflows do.
  smoke-scripts:
    runs-on: ${{ fromJSON(vars.RUNNER_LINUX || (github.repository_owner == 'JakobMelchard' && toJSON(github.event.repository.private) != 'false' && '"blacksmith-2vcpu-ubuntu-2404"' || '"ubuntu-latest"')) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./actions/scripts
      - run: jm-pr-title
        env: { TITLE: "ci: smoke" }

  # Calls each reusable workflow with its emptiest inputs. An empty `${{ inputs.x }}` interpolated
  # into a run body can break every caller at runtime while passing actionlint.
  smoke-hooks:
    uses: ./.github/workflows/hooks.yml
    with:
      # ubuntu-latest has no tofu
      skip: tofu-fmt

  smoke-python:
    uses: ./.github/workflows/python.yml
    with:
      package-manager: none
      install-cmd: ""
      lint-cmd: ""
      test-cmd: ""

  smoke-node:
    uses: ./.github/workflows/node.yml
    with:
      install-cmd: ""
      lint-cmd: ""
      check-cmd: ""
      test-cmd: ""
      # exercise the Chromium install path once here, not first in a caller
      browsers: true
      e2e-cmd: npx --yes playwright-core --version

  smoke-go:
    uses: ./.github/workflows/go.yml
    with:
      vet-cmd: ""
      test-cmd: ""
      build-cmd: ""

  smoke-shell:
    uses: ./.github/workflows/shell.yml
    with:
      paths: scripts
      severity: warning

  # Plan and apply need Infisical and a state, so both stay off: the jobs skip, which still proves
  # the file parses and the caller-side permissions resolve.
  smoke-tofu:
    uses: ./.github/workflows/tofu.yml
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    with:
      plan: false
      apply: false
      state-commit: false

  smoke-terraform:
    uses: ./.github/workflows/terraform.yml
    with:
      working-directory: scripts/test/tf-smoke

  # Dry run bundles the fixture Worker (a Durable Object and its migration) and publishes nothing.
  # The caller still grants id-token: write because the reusable job asks for it.
  smoke-cf:
    uses: ./.github/workflows/cf.yml
    permissions:
      contents: read
      id-token: write
    with:
      working-directory: scripts/test/cf-smoke
      dry-run: true
      wrangler-version: 4.143.0
      install-cmd: ""

  # macOS minutes cost 10x: an empty scheme runs no xcodebuild, only the generate and lint plumbing.
  smoke-xcode:
    uses: ./.github/workflows/xcode.yml
    with:
      scheme: ""
      generate-cmd: ""
      lint-cmd: ""

  # Exercises the simulator step: the runner must end up with the default iPad.
  smoke-simulator:
    uses: ./.github/workflows/xcode.yml
    with:
      generate-cmd: ""
      lint-cmd: ""
      test-cmd: "echo 'platform=iOS Simulator,name=iPad Air 11-inch (M4)' && xcrun simctl list devices available | grep -F 'iPad Air 11-inch (M4) ('"

  # No Android project here: empty gradle-tasks runs only the JDK, SDK and Gradle setup.
  smoke-android:
    uses: ./.github/workflows/android.yml
    with:
      gradle-tasks: ""
