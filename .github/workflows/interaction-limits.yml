name: interaction-limits

# GitHub's interaction limits expire after six months at most. This re-applies the limit every
# repo in infra/settings.json declares (`interaction_limit`: `collaborators_only`,
# `contributors_only` or `existing_users`) with the org GitHub App, monthly, so a public repo
# that only wants collaborators filing issues stays that way. Without the APP_* secrets the job
# says so and exits green.

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - infra/settings.json
      - .github/workflows/interaction-limits.yml
  schedule:
    - cron: "41 6 1 * *"
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      HAS_APP: ${{ secrets.APP_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }

      - name: repositories with a limit
        id: repos
        shell: bash
        run: |
          list=$(jq -c '.repos | to_entries | map(select(.value.interaction_limit != null and .value.archived != true) | {repo: .key, limit: .value.interaction_limit})' infra/settings.json)
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "names=$(jq -r 'map(.repo) | join(",")' <<<"$list")" >> "$GITHUB_OUTPUT"

      - name: mint app token
        id: app
        if: env.HAS_APP == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0 # zizmor: ignore[github-app]
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.repos.outputs.names }}
          permission-administration: write

      - name: apply
        if: env.HAS_APP == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          REPOS: ${{ steps.repos.outputs.list }}
        shell: bash
        run: |
          echo "$REPOS" | jq -c '.[]' | while read -r r; do
            repo=$(jq -r .repo <<<"$r"); limit=$(jq -r .limit <<<"$r")
            gh api -X PUT "repos/$OWNER/$repo/interaction-limits" -f "limit=$limit" -f expiry=six_months \
              --jq '"'"$repo"': \(.limit) until \(.expires_at)"'
          done

      - if: env.HAS_APP != 'true'
        run: echo "APP_CLIENT_ID / APP_PRIVATE_KEY not set; nothing applied"
